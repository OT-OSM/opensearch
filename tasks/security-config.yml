---
# ===========================
# TLS Certificate Deployment
# ===========================
- name: Create certificates directory
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0700"

- name: Copy TLS certificates
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ opensearch_certs_dir }}/{{ item.filename }}"
    owner: opensearch
    group: opensearch
    mode: "0600"
  loop:
    - src: "{{ opensearch_root_ca_path | default('') }}"
      filename: root-ca.pem
      enabled: "{{ opensearch_root_ca_path is defined }}"
    - src: "{{ opensearch_admin_cert_path | default('') }}"
      filename: admin.pem
      enabled: "{{ opensearch_admin_cert_path is defined }}"
    - src: "{{ opensearch_admin_key_path | default('') }}"
      filename: admin-key.pem
      enabled: "{{ opensearch_admin_key_path is defined }}"
    - src: "{{ opensearch_node_cert_path | default('') }}"
      filename: node.pem
      enabled: "{{ opensearch_node_cert_path is defined }}"
    - src: "{{ opensearch_node_key_path | default('') }}"
      filename: node-key.pem
      enabled: "{{ opensearch_node_key_path is defined }}"
  when: item.enabled | bool
  loop_control:
    label: "{{ item.filename }}"
  notify: Restart OpenSearch

# ===========================
# Internal Users
# ===========================
- name: Deploy internal_users.yml
  ansible.builtin.template:
    src: internal_users.yml.j2
    dest: "{{ opensearch_security_config_dir }}/internal_users.yml"
    owner: opensearch
    group: opensearch
    mode: "0640"

# ===========================
# Apply Security Config
# ===========================
- name: Apply security configuration (securityadmin.sh)
  ansible.builtin.command: >
    {{ opensearch_security_config_dir | dirname }}/tools/securityadmin.sh
    -cd {{ opensearch_security_config_dir }}/
    -icl -nhnv
    -cacert {{ opensearch_certs_dir }}/root-ca.pem
    -cert {{ opensearch_certs_dir }}/admin.pem
    -key {{ opensearch_certs_dir }}/admin-key.pem
  environment:
    JAVA_HOME: "{{ opensearch_java_home }}"
  register: security_admin_result
  changed_when: "'ERR:' not in security_admin_result.stdout"
  failed_when: false
