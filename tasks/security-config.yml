---
# ==========================================================
# TLS Certificate Configuration (PROD SAFE)
# ==========================================================

# ----------------------------------------------------------
# Ensure cert directory exists
# ----------------------------------------------------------
- name: Ensure OpenSearch certs directory exists
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0750"

# ----------------------------------------------------------
# Verify required TLS files exist (company provided)
# ----------------------------------------------------------
- name: Check TLS certificate files
  ansible.builtin.stat:
    path: "{{ opensearch_certs_dir }}/{{ item }}"
  loop:
    - "{{ opensearch_tls_root_ca_file }}"
    - "{{ opensearch_tls_cert_file }}"
    - "{{ opensearch_tls_key_file }}"
  register: tls_files

- name: Fail if TLS file missing
  ansible.builtin.fail:
    msg: "Missing TLS file: {{ item.item }}"
  when: not item.stat.exists
  loop: "{{ tls_files.results }}"

# ----------------------------------------------------------
# Permission check (FIX ONLY IF WRONG)
# ----------------------------------------------------------
- name: Check TLS file permissions
  ansible.builtin.stat:
    path: "{{ opensearch_certs_dir }}/{{ item.name }}"
  loop:
    - { name: "{{ opensearch_tls_root_ca_file }}", mode: "0644" }
    - { name: "{{ opensearch_tls_cert_file }}",    mode: "0644" }
    - { name: "{{ opensearch_tls_key_file }}",     mode: "0600" }
  register: tls_permissions

- name: Fix TLS permissions only if needed
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}/{{ item.item.name }}"
    owner: opensearch
    group: opensearch
    mode: "{{ item.item.mode }}"
  when: >
    item.stat.exists and
    (item.stat.mode | int(base=8)) != (item.item.mode | int(base=8))
  loop: "{{ tls_permissions.results }}"

# ----------------------------------------------------------
# Wait for OpenSearch HTTPS (service already running)
# ----------------------------------------------------------
- name: Wait for OpenSearch HTTPS
  ansible.builtin.wait_for:
    host: "{{ opensearch_api_host }}"
    port: "{{ opensearch_http_port }}"
    delay: 10
    timeout: 300

# ----------------------------------------------------------
# Apply security config using SAME company certs
# ----------------------------------------------------------
- name: Apply security config via securityadmin
  ansible.builtin.command: >
    {{ opensearch_security_config_dir | dirname }}/tools/securityadmin.sh
    -cd {{ opensearch_security_config_dir }}
    -nhnv
    -h {{ opensearch_api_host }}
    -p {{ opensearch_http_port }}
    -https
    -cacert {{ opensearch_certs_dir }}/{{ opensearch_tls_root_ca_file }}
    -cert {{ opensearch_certs_dir }}/{{ opensearch_tls_cert_file }}
    -key {{ opensearch_certs_dir }}/{{ opensearch_tls_key_file }}
  environment:
    OPENSEARCH_PATH_CONF: "{{ opensearch_config_dir }}"
    ES_PATH_CONF: "{{ opensearch_config_dir }}"
  register: security_admin_result
  notify: Restart OpenSearch

- name: Fail if securityadmin failed
  ansible.builtin.fail:
    msg: |
      SecurityAdmin failed
      STDOUT: {{ security_admin_result.stdout }}
      STDERR: {{ security_admin_result.stderr }}
  when: security_admin_result.rc != 0
