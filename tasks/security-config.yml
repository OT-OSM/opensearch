---
# ===========================
# TLS Certificate Configuration (PKCS#8 + Two-Cert Strategy)
# ===========================
# This task file handles TLS certificate setup for OpenSearch.
# It generates RSA PKCS#8 certificates for the transport layer (internal)
# to ensure compatibility, while HTTP access uses user-provided certificates.

- name: Create certificates directory
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0750"

# Set absolute paths for robustness (handles cases where variables might be absolute or relative)
- name: Set absolute certificate paths for securityadmin
  ansible.builtin.set_fact:
    _os_abs_root_ca: "{{ (opensearch_root_ca_path is abs) | ternary(opensearch_root_ca_path, opensearch_config_dir ~ '/' ~ opensearch_root_ca_path) }}"
    _os_abs_mgmt_cert: "{{ (opensearch_admin_cert_path is abs) | ternary(opensearch_admin_cert_path, opensearch_config_dir ~ '/' ~ opensearch_admin_cert_path) }}"
    _os_abs_mgmt_key: "{{ (opensearch_admin_key_path is abs) | ternary(opensearch_admin_key_path, opensearch_config_dir ~ '/' ~ opensearch_admin_key_path) }}"
    _os_abs_transport_ca: "{{ (opensearch_transport_root_ca_path is abs) | ternary(opensearch_transport_root_ca_path, opensearch_config_dir ~ '/' ~ opensearch_transport_root_ca_path) }}"
    _os_abs_transport_cert: "{{ (opensearch_transport_node_cert_path is abs) | ternary(opensearch_transport_node_cert_path, opensearch_config_dir ~ '/' ~ opensearch_transport_node_cert_path) }}"
    _os_abs_transport_key: "{{ (opensearch_transport_node_key_path is abs) | ternary(opensearch_transport_node_key_path, opensearch_config_dir ~ '/' ~ opensearch_transport_node_key_path) }}"

# ===========================
# 1. Transport Layer Certificates (User Provided)
# ===========================
- name: Verify Transport Root CA exists
  ansible.builtin.stat:
    path: "{{ _os_abs_transport_ca }}"
  register: _transport_ca_stat

- name: Fail if Transport Root CA is missing
  ansible.builtin.fail:
    msg: "Transport Root CA not found at {{ _transport_ca_stat.stat.path }}. You must provide valid certificates when opensearch_use_tls is true."
  when: not _transport_ca_stat.stat.exists

- name: Verify Transport Node Cert exists
  ansible.builtin.stat:
    path: "{{ _os_abs_transport_cert }}"
  register: _transport_cert_stat

- name: Fail if Transport Node Cert is missing
  ansible.builtin.fail:
    msg: "Transport Node Cert not found at {{ _transport_cert_stat.stat.path }}."
  when: not _transport_cert_stat.stat.exists

- name: Verify Transport Node Key exists
  ansible.builtin.stat:
    path: "{{ _os_abs_transport_key }}"
  register: _transport_key_stat

- name: Fail if Transport Node Key is missing
  ansible.builtin.fail:
    msg: "Transport Node Key not found at {{ _transport_key_stat.stat.path }}."
  when: not _transport_key_stat.stat.exists

# ===========================
# 2. HTTP Layer Certificates (User Provided)
# ===========================
- name: Verify HTTP Root CA exists
  ansible.builtin.stat:
    path: "{{ _os_abs_root_ca }}"
  register: _http_ca_stat

- name: Fail if HTTP Root CA is missing
  ansible.builtin.fail:
    msg: "HTTP Root CA not found at {{ _http_ca_stat.stat.path }}."
  when: not _http_ca_stat.stat.exists

- name: Verify HTTP Node Cert exists
  ansible.builtin.stat:
    path: "{{ opensearch_node_cert_path if opensearch_node_cert_path.startswith('/') else opensearch_config_dir + '/' + opensearch_node_cert_path }}"
  register: _http_cert_stat

- name: Fail if HTTP Node Cert is missing
  ansible.builtin.fail:
    msg: "HTTP Node Cert not found at {{ _http_cert_stat.stat.path }}."
  when: not _http_cert_stat.stat.exists

- name: Verify HTTP Node Key exists
  ansible.builtin.stat:
    path: "{{ opensearch_node_key_path if opensearch_node_key_path.startswith('/') else opensearch_config_dir + '/' + opensearch_node_key_path }}"
  register: _http_key_stat

- name: Fail if HTTP Node Key is missing
  ansible.builtin.fail:
    msg: "HTTP Node Key not found at {{ _http_key_stat.stat.path }}."
  when: not _http_key_stat.stat.exists

# ===========================
# 3. Admin Certificates (User Provided)
# ===========================
- name: Verify Admin Cert exists
  ansible.builtin.stat:
    path: "{{ _os_abs_mgmt_cert }}"
  register: _admin_cert_stat

- name: Fail if Admin Cert is missing
  ansible.builtin.fail:
    msg: "Admin Cert not found at {{ _admin_cert_stat.stat.path }}. Required for securityadmin.sh."
  when: not _admin_cert_stat.stat.exists

- name: Verify Admin Key exists
  ansible.builtin.stat:
    path: "{{ _os_abs_mgmt_key }}"
  register: _admin_key_stat

- name: Fail if Admin Key is missing
  ansible.builtin.fail:
    msg: "Admin Key not found at {{ _admin_key_stat.stat.path }}."
  when: not _admin_key_stat.stat.exists

# ===========================
# 4. Copy Certificates to Config Dir
# ===========================
- name: Ensure certificates are in the correct location with correct permissions
  ansible.builtin.copy:
    src: "{{ item.src if item.src.startswith('/') else opensearch_config_dir + '/' + item.src }}"
    dest: "{{ opensearch_certs_dir }}/{{ item.dest }}"
    owner: opensearch
    group: opensearch
    mode: "0600"
    remote_src: true
  loop:
    # Transport
    - {
        src: "{{ opensearch_transport_root_ca_path }}",
        dest: "transport-root-ca.pem",
      }
    - {
        src: "{{ opensearch_transport_node_cert_path }}",
        dest: "transport.pem",
      }
    - {
        src: "{{ opensearch_transport_node_key_path }}",
        dest: "transport-key.pem",
      }
    # HTTP
    - { src: "{{ opensearch_root_ca_path }}", dest: "root-ca.pem" }
    - { src: "{{ opensearch_node_cert_path }}", dest: "node.pem" }
    - { src: "{{ opensearch_node_key_path }}", dest: "node-key.pem" }
  ignore_errors: true

# ===========================
# 3. Dedicated Admin Certificate Generation (Self-Signed)
# ===========================
# We generate a dedicated CA and Client Cert for securityadmin.sh usage only.
# This avoids issues with user-provided certs lacking 'clientAuth' EKU.

- name: Create directory for generated admin certificates
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}/admin-gen"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0700"

- name: Generate Admin CA Private Key
  ansible.builtin.command: >
    openssl genrsa -out {{ opensearch_certs_dir }}/admin-gen/admin-ca.key 2048
  args:
    creates: "{{ opensearch_certs_dir }}/admin-gen/admin-ca.key"

- name: Generate Admin CA Certificate
  ansible.builtin.command: >
    openssl req -x509 -new -nodes -key {{ opensearch_certs_dir }}/admin-gen/admin-ca.key
    -sha256 -days 3650 -out {{ opensearch_certs_dir }}/admin-gen/admin-ca.pem
    -subj "/CN=OpenSearch-Admin-CA"
  args:
    creates: "{{ opensearch_certs_dir }}/admin-gen/admin-ca.pem"

- name: Generate Admin Client Private Key
  ansible.builtin.command: >
    openssl genrsa -out {{ opensearch_certs_dir }}/admin-gen/admin.key 2048
  args:
    creates: "{{ opensearch_certs_dir }}/admin-gen/admin.key"

- name: Generate Admin Client CSR
  ansible.builtin.command: >
    openssl req -new -key {{ opensearch_certs_dir }}/admin-gen/admin.key
    -out {{ opensearch_certs_dir }}/admin-gen/admin.csr
    -subj "/CN=opensearch-admin"
  args:
    creates: "{{ opensearch_certs_dir }}/admin-gen/admin.csr"

- name: Create OpenSSL config for clientAuth extension
  ansible.builtin.copy:
    dest: "{{ opensearch_certs_dir }}/admin-gen/client-ext.cnf"
    content: |
      extendedKeyUsage = clientAuth

- name: Sign Admin Client Certificate with Admin CA
  ansible.builtin.command: >
    openssl x509 -req -in {{ opensearch_certs_dir }}/admin-gen/admin.csr
    -CA {{ opensearch_certs_dir }}/admin-gen/admin-ca.pem
    -CAkey {{ opensearch_certs_dir }}/admin-gen/admin-ca.key
    -CAcreateserial -out {{ opensearch_certs_dir }}/admin-gen/admin.pem
    -days 3650 -sha256 -extfile {{ opensearch_certs_dir }}/admin-gen/client-ext.cnf
  args:
    creates: "{{ opensearch_certs_dir }}/admin-gen/admin.pem"

- name: Set permissions for generated admin keys
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}/admin-gen"
    recurse: true
    owner: opensearch
    group: opensearch
    mode: "0600"

# ===========================
# 5. Assemble Combined Truststore (Admin mTLS Fix)
# ===========================
- name: Assemble combined truststore (root-ca-all.pem)
  ansible.builtin.shell: |
    cat {{ opensearch_certs_dir }}/root-ca.pem > {{ opensearch_certs_dir }}/root-ca-all.pem
    echo "" >> {{ opensearch_certs_dir }}/root-ca-all.pem
    cat {{ opensearch_certs_dir }}/transport-root-ca.pem >> {{ opensearch_certs_dir }}/root-ca-all.pem
    echo "" >> {{ opensearch_certs_dir }}/root-ca-all.pem
    cat {{ opensearch_certs_dir }}/admin-gen/admin-ca.pem >> {{ opensearch_certs_dir }}/root-ca-all.pem
  when: opensearch_use_tls | bool
  changed_when: true

- name: Fix certificate permissions and ownership
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}"
    owner: opensearch
    group: opensearch
    mode: "0750"
    recurse: true

# ===========================
# 6. Service Lifecycle for Initial TLS configuration
# ===========================
- name: Ensure OpenSearch is stopped before TLS start
  ansible.builtin.systemd:
    name: opensearch
    state: stopped
  failed_when: false

- name: Start OpenSearch with TLS
  ansible.builtin.systemd:
    name: opensearch
    state: started
  async: 600
  poll: 10
  register: _os_start_tls
  ignore_errors: true

- name: Capture OpenSearch journal logs on failure
  ansible.builtin.shell: journalctl -u opensearch -n 100 --no-pager
  when: _os_start_tls.failed | default(false)
  register: _os_journal_logs
  changed_when: false

- name: Display OpenSearch journal logs on failure
  ansible.builtin.debug:
    var: _os_journal_logs.stdout_lines
  when: _os_start_tls.failed | default(false)

- name: Fail if OpenSearch failed to start
  ansible.builtin.fail:
    msg: "OpenSearch failed to start with TLS. Check logs above."
  when: _os_start_tls.failed | default(false)

- name: Wait for OpenSearch transport port (9300)
  ansible.builtin.wait_for:
    host: {{ opensearch_api_host }}
    port: "{{ opensearch_transport_port }}"
    delay: 10
    timeout: 300
    state: started

- name: Robust initialization wait (Sleep 30s)
  ansible.builtin.pause:
    seconds: 30
  when: opensearch_use_tls | bool

# ===========================
# 7. Apply Security Config
# ===========================

- name: DEBUG - Check opensearch.yml content on target
  ansible.builtin.shell: grep "plugins.security.ssl.http.enabled" /etc/opensearch/opensearch.yml
  register: _dbg_config
  changed_when: false
  ignore_errors: true

- name: DEBUG - Show config grep
  ansible.builtin.debug:
    var: _dbg_config.stdout_lines

- name: DEBUG - Check securityadmin.sh script content
  ansible.builtin.shell: head -n 50 {{ opensearch_security_config_dir | dirname }}/tools/securityadmin.sh
  register: _dbg_script
  changed_when: false
  ignore_errors: true

- name: DEBUG - Show script content
  ansible.builtin.debug:
    var: _dbg_script.stdout_lines

- name: Deploy internal_users.yml
  ansible.builtin.template:
    src: internal_users.yml.j2
    dest: "{{ opensearch_security_config_dir }}/internal_users.yml"
    owner: opensearch
    group: opensearch
    mode: "0640"

- name: Set securityadmin protocol flags
  ansible.builtin.set_fact:
    _securityadmin_protocol_flag: "{{ '-https' if opensearch_use_tls else '' }}"
    _securityadmin_ca_flag: >-
      {{ '-cacert ' ~ opensearch_certs_dir ~ '/root-ca-all.pem'
         if opensearch_use_tls else '' }}    

- name: Apply security configuration (securityadmin.sh)
  ansible.builtin.command: >
    {{ opensearch_security_config_dir | dirname }}/tools/securityadmin.sh
    -cd {{ opensearch_security_config_dir }}/
    -icl -nhnv
    -h {{ opensearch_api_host }}
    -p {{ opensearch_http_port }}
    {{ _securityadmin_protocol_flag }}
    {{ _securityadmin_ca_flag }}
    -cert {{ opensearch_certs_dir }}/admin-gen/admin.pem
    -key {{ opensearch_certs_dir }}/admin-gen/admin.key
  environment:
    JAVA_HOME: "{{ opensearch_java_home }}"
    OPENSEARCH_HOME: "/usr/share/opensearch"
    OPENSEARCH_PATH_CONF: "{{ opensearch_config_dir }}"
    ES_PATH_CONF: "{{ opensearch_config_dir }}"
  register: security_admin_result
  ignore_errors: true

- name: Capture detailed server logs on securityadmin failure
  ansible.builtin.shell: tail -n 200 {{ opensearch_logs_path }}/{{ opensearch_cluster_name }}-standalone.log
  when: security_admin_result.failed | default(false)
  register: _os_security_logs
  ignore_errors: true
  changed_when: false

- name: Display internal server logs on failure
  ansible.builtin.debug:
    var: _os_security_logs.stdout_lines
  when: security_admin_result.failed | default(false)

- name: Fail if securityadmin failed
  ansible.builtin.fail:
    msg: "SecurityAdmin failed. Check logs above. Output: {{ security_admin_result.stdout }}"
  when: security_admin_result.failed | default(false)

- name: Restart OpenSearch to apply configuration
  ansible.builtin.systemd:
    name: opensearch
    state: restarted

- name: Final wait for OpenSearch service
  ansible.builtin.wait_for:
    port: "{{ opensearch_http_port }}"
    host: "{{ opensearch_api_host }}"
    delay: 10
    timeout: 150

- name: Ensure OpenSearch Dashboards is started
  ansible.builtin.systemd:
    name: opensearch-dashboards
    state: started
  ignore_errors: true
  failed_when: false
