---
# Ensure cert directory exists

- name: Ensure OpenSearch certs directory exists
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0750"

- name: Copy TLS certificates to certs directory
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: opensearch
    group: opensearch
    mode: "{{ item.mode }}"
    remote_src: true
  loop:
    - {
        src: "{{ opensearch_root_ca_path }}",
        dest: "{{ opensearch_certs_dir }}/chain.pem",
        mode: "0644",
      }
    - {
        src: "{{ opensearch_admin_cert_path }}",
        dest: "{{ opensearch_certs_dir }}/admin.pem",
        mode: "0644",
      }
    - {
        src: "{{ opensearch_admin_key_path }}",
        dest: "{{ opensearch_certs_dir }}/admin-key.pem",
        mode: "0600",
      }
  when: opensearch_use_tls | bool
  ignore_errors: true

- name: Update certificate paths to internal directory
  ansible.builtin.set_fact:
    opensearch_root_ca_path: "{{ opensearch_certs_dir }}/chain.pem"
    opensearch_admin_cert_path: "{{ opensearch_certs_dir }}/admin.pem"
    opensearch_admin_key_path: "{{ opensearch_certs_dir }}/admin-key.pem"
  when: opensearch_use_tls | bool

# Verify TLS files exist

- name: Check TLS certificate files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ opensearch_root_ca_path }}"
    - "{{ opensearch_admin_cert_path }}"
    - "{{ opensearch_admin_key_path }}"
  register: tls_files
  when: opensearch_use_tls | bool

- name: Fail if TLS file missing
  ansible.builtin.fail:
    msg: "Missing TLS file: {{ item.item }}"
  when:
    - opensearch_use_tls | bool
    - not item.stat.exists
  loop: "{{ tls_files.results }}"

# Fix TLS permissions

- name: Fix TLS file permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: opensearch
    group: opensearch
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ opensearch_root_ca_path }}", mode: "0644" }
    - { path: "{{ opensearch_admin_cert_path }}", mode: "0644" }
    - { path: "{{ opensearch_admin_key_path }}", mode: "0600" }
  when: opensearch_use_tls | bool

# Fix security config permissions

- name: Fix OpenSearch security config permissions
  ansible.builtin.file:
    path: "{{ opensearch_security_config_dir }}"
    owner: opensearch
    group: opensearch
    mode: "0700"
    recurse: true

# Restart OpenSearch (TLS mode only — config changed)

- name: Restart OpenSearch
  ansible.builtin.systemd:
    name: opensearch
    state: restarted
    enabled: true
    daemon_reload: true
  when: opensearch_use_tls | bool

# Wait for OpenSearch

- name: Wait for OpenSearch HTTPS
  ansible.builtin.wait_for:
    host: "{{ opensearch_api_host }}"
    port: "{{ opensearch_http_port }}"
    delay: 15
    timeout: 180
  when: opensearch_use_tls | bool

# Deploy Security Config templates — runs in BOTH TLS and HTTP modes

- name: Deploy internal_users.yml to security config dir
  ansible.builtin.template:
    src: internal_users.yml.j2
    dest: "{{ opensearch_security_config_dir }}/internal_users.yml"
    owner: opensearch
    group: opensearch
    mode: "0600"

- name: Deploy roles_mapping.yml to security config dir
  ansible.builtin.template:
    src: roles_mapping.yml.j2
    dest: "{{ opensearch_security_config_dir }}/roles_mapping.yml"
    owner: opensearch
    group: opensearch
    mode: "0600"

# Initialize Security Index via securityadmin.sh (TLS mode only)

- name: Initialize OpenSearch Security Index
  ansible.builtin.command: >
    /usr/share/opensearch/plugins/opensearch-security/tools/securityadmin.sh
    -cd "{{ opensearch_security_config_dir }}"
    -icl
    -nhnv
    -cacert "{{ opensearch_root_ca_path }}"
    -cert "{{ opensearch_admin_cert_path }}"
    -key "{{ opensearch_admin_key_path }}"
    -h "{{ opensearch_api_host }}"
  register: security_init
  when: opensearch_use_tls | bool
  changed_when: "'Done with success' in security_init.stdout"

# Restart after init (TLS only)

- name: Restart OpenSearch after security init
  ansible.builtin.systemd:
    name: opensearch
    state: restarted
  when:
    - opensearch_use_tls | bool
    - security_init is changed

# Final wait (TLS only)

- name: Wait for OpenSearch HTTPS after security init
  ansible.builtin.wait_for:
    host: "{{ opensearch_api_host }}"
    port: "{{ opensearch_http_port }}"
    delay: 15
    timeout: 180
  when:
    - opensearch_use_tls | bool
    - security_init is changed

# ===========================
# Security Verification — runs in BOTH TLS and HTTP modes
# ===========================

- name: Determine protocol
  ansible.builtin.set_fact:
    _opensearch_protocol: "{{ 'https' if opensearch_use_tls | bool else 'http' }}"

- name: Wait for OpenSearch to accept authenticated requests
  ansible.builtin.uri:
    url: "{{ _opensearch_protocol }}://{{ opensearch_api_host }}:{{ opensearch_http_port }}/_cluster/health"
    method: GET
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: health_with_auth
  retries: 30
  delay: 10
  until: health_with_auth.status == 200

- name: Display authenticated cluster health
  ansible.builtin.debug:
    msg: >
      Connected to {{ opensearch_api_host }}
      | Cluster status: {{ health_with_auth.json.status }}

- name: Apply roles mapping for admin user (Securely with retry)
  ansible.builtin.uri:
    url: "{{ _opensearch_protocol }}://{{ opensearch_api_host }}:{{ opensearch_http_port }}/_plugins/_security/api/rolesmapping/{{ item }}"
    method: PUT
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      users:
        - "{{ opensearch_admin_username }}"
      backend_roles:
        - "admin"
    status_code: [200, 201]
  loop:
    - "all_access"
    - "snapshot_management_full_access"
    - "manage_snapshots"
  register: mapping_update
  retries: 5
  delay: 10
  until: mapping_update.status in [200, 201]
  run_once: true

- name: Verify roles mapping applied
  ansible.builtin.uri:
    url: "{{ _opensearch_protocol }}://{{ opensearch_api_host }}:{{ opensearch_http_port }}/_plugins/_security/api/rolesmapping/all_access"
    method: GET
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
  register: verify_roles
  retries: 5
  delay: 10
  until: >
    (
      (verify_roles.json.all_access.users is defined and
       opensearch_admin_username in verify_roles.json.all_access.users)
      or
      (verify_roles.json.users is defined and
       opensearch_admin_username in verify_roles.json.users)
    )

- name: Verify restore permissions (Authinfo)
  ansible.builtin.uri:
    url: "{{ _opensearch_protocol }}://{{ opensearch_api_host }}:{{ opensearch_http_port }}/_plugins/_security/authinfo"
    method: GET
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
  register: auth_info
  failed_when: >
    (auth_info.status != 200) or
    ('all_access' not in auth_info.json.roles) or
    ('snapshot_management_full_access' not in auth_info.json.roles)
