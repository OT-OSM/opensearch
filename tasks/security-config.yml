---
# ===========================
# TLS Certificate Configuration (PKCS#8 + Two-Cert Strategy)
# ===========================
# This task file handles TLS certificate setup for OpenSearch.
# It generates RSA PKCS#8 certificates for the transport layer (internal)
# to ensure compatibility, while HTTP access uses user-provided certificates.

- name: Create certificates directory
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0750"

# ===========================
# Cleanup old internal certs (Forced regeneration)
# ===========================
# We remove old internal certs to ensure they are regenerated with the new
# PKCS#8 format and simplified DNs. This prevents service hangs from older,
# incompatible certificate formats.
- name: Remove old internal certificates to force regeneration
  ansible.builtin.file:
    path: "{{ opensearch_config_dir }}/{{ item }}"
    state: absent
  loop:
    - certs/transport-root-ca.pem
    - certs/transport-root-ca-key.pem
    - certs/transport-node.pem
    - certs/transport-node-key.pem
    - certs/admin.pem
    - certs/admin-key.pem
  when: opensearch_use_tls | bool

# ===========================
# Generate Transport Certificates (RSA PKCS#8)
# ===========================
- name: Generate transport Root CA
  ansible.builtin.shell: |
    openssl genrsa -out {{ opensearch_certs_dir }}/transport-ca-pkcs1.pem 2048
    openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt -in {{ opensearch_certs_dir }}/transport-ca-pkcs1.pem -out {{ opensearch_certs_dir }}/transport-root-ca-key.pem
    openssl req -x509 -new -nodes -key {{ opensearch_certs_dir }}/transport-root-ca-key.pem -sha256 -days 3650 -subj "/CN=Transport-CA" -out {{ opensearch_config_dir }}/{{ opensearch_transport_root_ca_path }}
    rm {{ opensearch_certs_dir }}/transport-ca-pkcs1.pem
  when: opensearch_use_tls | bool

- name: Generate transport node certificate
  ansible.builtin.shell: |
    openssl genrsa -out {{ opensearch_certs_dir }}/node-temp-pkcs1.pem 2048
    openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt -in {{ opensearch_certs_dir }}/node-temp-pkcs1.pem -out {{ opensearch_config_dir }}/{{ opensearch_transport_node_key_path }}
    openssl req -new -key {{ opensearch_config_dir }}/{{ opensearch_transport_node_key_path }} -subj "/CN=opensearch-node" -out {{ opensearch_certs_dir }}/node.csr
    openssl x509 -req -in {{ opensearch_certs_dir }}/node.csr -CA {{ opensearch_config_dir }}/{{ opensearch_transport_root_ca_path }} -CAkey {{ opensearch_certs_dir }}/transport-root-ca-key.pem -CAcreateserial -out {{ opensearch_config_dir }}/{{ opensearch_transport_node_cert_path }} -days 3650 -sha256
    rm {{ opensearch_certs_dir }}/node-temp-pkcs1.pem {{ opensearch_certs_dir }}/node.csr
  when: opensearch_use_tls | bool

- name: Generate management certificate (for securityadmin.sh)
  ansible.builtin.shell: |
    openssl genrsa -out {{ opensearch_certs_dir }}/mgmt-temp-pkcs1.pem 2048
    openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt -in {{ opensearch_certs_dir }}/mgmt-temp-pkcs1.pem -out {{ opensearch_config_dir }}/{{ opensearch_mgmt_key_path }}
    openssl req -new -key {{ opensearch_config_dir }}/{{ opensearch_mgmt_key_path }} -subj "/CN=opensearch-admin" -out {{ opensearch_certs_dir }}/mgmt.csr
    openssl x509 -req -in {{ opensearch_certs_dir }}/mgmt.csr -CA {{ opensearch_config_dir }}/{{ opensearch_transport_root_ca_path }} -CAkey {{ opensearch_certs_dir }}/transport-root-ca-key.pem -CAcreateserial -out {{ opensearch_config_dir }}/{{ opensearch_mgmt_cert_path }} -days 3650 -sha256
    rm {{ opensearch_certs_dir }}/mgmt-temp-pkcs1.pem {{ opensearch_certs_dir }}/mgmt.csr
  when: opensearch_use_tls | bool

- name: Fix certificate permissions and ownership
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0750"
    recurse: true

# ===========================
# Service Lifecycle for Initial TLS configuration
# ===========================
- name: Ensure OpenSearch is stopped before TLS start
  ansible.builtin.systemd:
    name: opensearch
    state: stopped
  failed_when: false

- name: Start OpenSearch with TLS
  ansible.builtin.systemd:
    name: opensearch
    state: started
  async: 300
  poll: 5

- name: Wait for OpenSearch port
  ansible.builtin.wait_for:
    port: "{{ opensearch_http_port }}"
    host: 127.0.0.1
    delay: 10
    timeout: 150

# ===========================
# Apply Security Config
# ===========================
- name: Deploy internal_users.yml
  ansible.builtin.template:
    src: internal_users.yml.j2
    dest: "{{ opensearch_security_config_dir }}/internal_users.yml"
    owner: opensearch
    group: opensearch
    mode: "0640"

- name: Apply security configuration (securityadmin.sh)
  ansible.builtin.command: >
    {{ opensearch_security_config_dir | dirname }}/tools/securityadmin.sh
    -cd {{ opensearch_security_config_dir }}/
    -icl -nhnv
    -cacert {{ opensearch_config_dir }}/{{ opensearch_transport_root_ca_path }}
    -cert {{ opensearch_config_dir }}/{{ opensearch_mgmt_cert_path }}
    -key {{ opensearch_config_dir }}/{{ opensearch_mgmt_key_path }}
  environment:
    JAVA_HOME: "{{ opensearch_java_home }}"
  register: security_admin_result
  changed_when: "'ERR:' not in security_admin_result.stdout"

- name: Restart OpenSearch to apply configuration
  ansible.builtin.systemd:
    name: opensearch
    state: restarted

- name: Final wait for OpenSearch service
  ansible.builtin.wait_for:
    port: "{{ opensearch_http_port }}"
    host: 127.0.0.1
    delay: 10
    timeout: 150
