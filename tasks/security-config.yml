---
# ===========================
# TLS Certificate Configuration (PKCS#8 + Two-Cert Strategy)
# ===========================
# This task file handles TLS certificate setup for OpenSearch.
# It generates RSA PKCS#8 certificates for the transport layer (internal)
# to ensure compatibility, while HTTP access uses user-provided certificates.

- name: Create certificates directory
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0750"

# Set absolute paths for robustness (handles cases where variables might be absolute or relative)
- name: Set absolute certificate paths for securityadmin
  ansible.builtin.set_fact:
    _os_abs_root_ca: "{{ (opensearch_root_ca_path is abs) | ternary(opensearch_root_ca_path, opensearch_config_dir ~ '/' ~ opensearch_root_ca_path) }}"
    _os_abs_mgmt_cert: "{{ (opensearch_mgmt_cert_path is abs) | ternary(opensearch_mgmt_cert_path, opensearch_config_dir ~ '/' ~ opensearch_mgmt_cert_path) }}"
    _os_abs_mgmt_key: "{{ (opensearch_mgmt_key_path is abs) | ternary(opensearch_mgmt_key_path, opensearch_config_dir ~ '/' ~ opensearch_mgmt_key_path) }}"
    _os_abs_transport_ca: "{{ (opensearch_transport_root_ca_path is abs) | ternary(opensearch_transport_root_ca_path, opensearch_config_dir ~ '/' ~ opensearch_transport_root_ca_path) }}"
    _os_abs_transport_cert: "{{ (opensearch_transport_node_cert_path is abs) | ternary(opensearch_transport_node_cert_path, opensearch_config_dir ~ '/' ~ opensearch_transport_node_cert_path) }}"
    _os_abs_transport_key: "{{ (opensearch_transport_node_key_path is abs) | ternary(opensearch_transport_node_key_path, opensearch_config_dir ~ '/' ~ opensearch_transport_node_key_path) }}"
    _os_abs_combined_ca: "{{ (opensearch_http_combined_ca_path is abs) | ternary(opensearch_http_combined_ca_path, opensearch_config_dir ~ '/' ~ opensearch_http_combined_ca_path) }}"

# ===========================
# Cleanup old internal certs (Forced regeneration)
# ===========================
- name: Remove old internal certificates to force regeneration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ _os_abs_transport_ca }}"
    - "{{ opensearch_certs_dir }}/transport-ca-pkcs1.pem"
    - "{{ _os_abs_transport_cert }}"
    - "{{ _os_abs_transport_key }}"
    - "{{ _os_abs_mgmt_cert }}"
    - "{{ _os_abs_mgmt_key }}"
    - "{{ _os_abs_combined_ca }}"
  when: opensearch_use_tls | bool

# ===========================
# Generate Transport Certificates (RSA PKCS#8)
# ===========================
- name: Generate transport Root CA
  ansible.builtin.shell: |
    openssl genrsa -out {{ opensearch_certs_dir }}/transport-ca-pkcs1.pem 2048
    openssl req -x509 -new -nodes -key {{ opensearch_certs_dir }}/transport-ca-pkcs1.pem -sha256 -days 3650 -subj "/CN=Transport-CA" -out {{ _os_abs_transport_ca }}
  when: opensearch_use_tls | bool

- name: Generate transport node certificate
  ansible.builtin.shell: |
    # Generate PKCS#1 key
    openssl genrsa -out {{ opensearch_certs_dir }}/node-temp-pkcs1.pem 2048
    # Convert to PKCS#8 for OpenSearch
    openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt -in {{ opensearch_certs_dir }}/node-temp-pkcs1.pem -out {{ _os_abs_transport_key }}
    # Generate CSR
    openssl req -new -key {{ _os_abs_transport_key }} -subj "/CN=opensearch-node" -out {{ opensearch_certs_dir }}/node.csr
    # Sign certificate
    openssl x509 -req -in {{ opensearch_certs_dir }}/node.csr -CA {{ _os_abs_transport_ca }} -CAkey {{ opensearch_certs_dir }}/transport-ca-pkcs1.pem -CAcreateserial -out {{ _os_abs_transport_cert }} -days 3650 -sha256
    # Cleanup
    rm {{ opensearch_certs_dir }}/node-temp-pkcs1.pem {{ opensearch_certs_dir }}/node.csr
  when: opensearch_use_tls | bool

- name: Generate management certificate (for securityadmin.sh)
  ansible.builtin.shell: |
    # Generate PKCS#1 key
    openssl genrsa -out {{ opensearch_certs_dir }}/mgmt-temp-pkcs1.pem 2048
    # Convert to PKCS#8
    openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt -in {{ opensearch_certs_dir }}/mgmt-temp-pkcs1.pem -out {{ _os_abs_mgmt_key }}
    # Generate CSR
    openssl req -new -key {{ _os_abs_mgmt_key }} -subj "/CN=opensearch-admin" -out {{ opensearch_certs_dir }}/mgmt.csr
    # Sign certificate
    openssl x509 -req -in {{ opensearch_certs_dir }}/mgmt.csr -CA {{ _os_abs_transport_ca }} -CAkey {{ opensearch_certs_dir }}/transport-ca-pkcs1.pem -CAcreateserial -out {{ _os_abs_mgmt_cert }} -days 3650 -sha256
    # Cleanup
    rm {{ opensearch_certs_dir }}/mgmt-temp-pkcs1.pem {{ opensearch_certs_dir }}/mgmt.csr
  when: opensearch_use_tls | bool

# ===========================
# Merge CAs for HTTP Layer (Combined Truststore)
# ===========================
- name: Create combined HTTP truststore
  ansible.builtin.shell: |
    cat {{ _os_abs_root_ca }} > {{ _os_abs_combined_ca }}
    echo "" >> {{ _os_abs_combined_ca }}
    cat {{ _os_abs_transport_ca }} >> {{ _os_abs_combined_ca }}
  when: opensearch_use_tls | bool

- name: Fix certificate permissions and ownership
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0750"
    recurse: true

# ===========================
# Service Lifecycle for Initial TLS configuration
# ===========================
- name: Ensure OpenSearch is stopped before TLS start
  ansible.builtin.systemd:
    name: opensearch
    state: stopped
  failed_when: false

- name: Start OpenSearch with TLS
  ansible.builtin.systemd:
    name: opensearch
    state: started
  async: 600
  poll: 10
  register: _os_start_tls
  ignore_errors: true

- name: Capture OpenSearch journal logs on failure
  ansible.builtin.shell: journalctl -u opensearch -n 100 --no-pager
  when: _os_start_tls.failed | default(false)
  register: _os_journal_logs

- name: Display OpenSearch journal logs on failure
  ansible.builtin.debug:
    var: _os_journal_logs.stdout_lines
  when: _os_start_tls.failed | default(false)

- name: Fail if OpenSearch failed to start
  ansible.builtin.fail:
    msg: "OpenSearch failed to start with TLS. Check logs above."
  when: _os_start_tls.failed | default(false)

- name: Wait for OpenSearch transport port (9300)
  ansible.builtin.wait_for:
    port: "{{ opensearch_transport_port }}"
    host: 127.0.0.1
    delay: 10
    timeout: 300

- name: Robust initialization wait (Sleep 30s)
  ansible.builtin.pause:
    seconds: 30
  when: opensearch_use_tls | bool

# ===========================
# Apply Security Config
# ===========================
- name: Audit configuration for invalid settings
  ansible.builtin.shell: |
    grep "plugins.security.enabled" {{ opensearch_config_dir }}/opensearch.yml || true
  register: _os_config_audit

- name: Display configuration audit results
  ansible.builtin.debug:
    var: _os_config_audit.stdout_lines

- name: Deploy internal_users.yml
  ansible.builtin.template:
    src: internal_users.yml.j2
    dest: "{{ opensearch_security_config_dir }}/internal_users.yml"
    owner: opensearch
    group: opensearch
    mode: "0640"

- name: Apply security configuration (securityadmin.sh via Transport Port)
  ansible.builtin.command: >
    {{ opensearch_security_config_dir | dirname }}/tools/securityadmin.sh
    -cd {{ opensearch_security_config_dir }}/
    -icl -nhnv
    -h 127.0.0.1
    -p {{ opensearch_transport_port }}
    -cacert {{ _os_abs_transport_ca }}
    -cert {{ _os_abs_mgmt_cert }}
    -key {{ _os_abs_mgmt_key }}
  environment:
    JAVA_HOME: "{{ opensearch_java_home }}"
  register: security_admin_result
  ignore_errors: true

- name: Capture detailed server logs on securityadmin failure
  ansible.builtin.shell: tail -n 200 {{ opensearch_logs_path }}/{{ opensearch_cluster_name }}-standalone.log
  when: security_admin_result.failed | default(false)
  register: _os_security_logs
  ignore_errors: true

- name: Display internal server logs on failure
  ansible.builtin.debug:
    var: _os_security_logs.stdout_lines
  when: security_admin_result.failed | default(false)

- name: Fail if securityadmin failed
  ansible.builtin.fail:
    msg: "SecurityAdmin failed. Check logs above. Output: {{ security_admin_result.stdout }}"
  when: security_admin_result.failed | default(false)

- name: Restart OpenSearch to apply configuration
  ansible.builtin.systemd:
    name: opensearch
    state: restarted

- name: Final wait for OpenSearch service
  ansible.builtin.wait_for:
    port: "{{ opensearch_http_port }}"
    host: 127.0.0.1
    delay: 10
    timeout: 150
