---
# ===========================
# TLS Certificate Deployment
# ===========================
# Note: Certificates are expected to be manually placed on the server
# or managed by an external process/role, matching the Keycloak pattern.
# We only ensure the directory exists.

- name: Create certificates directory
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0700"

# ===========================
# Internal Users
# ===========================
- name: Deploy internal_users.yml
  ansible.builtin.template:
    src: internal_users.yml.j2
    dest: "{{ opensearch_security_config_dir }}/internal_users.yml"
    owner: opensearch
    group: opensearch
    mode: "0640"

# ===========================
# Apply Security Config
# ===========================
- name: Apply security configuration (securityadmin.sh)
  ansible.builtin.command: >
    {{ opensearch_security_config_dir | dirname }}/tools/securityadmin.sh
    -cd {{ opensearch_security_config_dir }}/
    -icl -nhnv
    -cacert {{ opensearch_root_ca_path }}
    -cert {{ opensearch_admin_cert_path }}
    -key {{ opensearch_admin_key_path }}
  environment:
    JAVA_HOME: "{{ opensearch_java_home }}"
  register: security_admin_result
  changed_when: "'ERR:' not in security_admin_result.stdout"
  failed_when: false
