---
- name: Validate supported OS family
  ansible.builtin.fail:
    msg: "OS family '{{ ansible_os_family }}' is not supported. Supported: Debian, RedHat"
  when: ansible_os_family not in ['Debian', 'RedHat']

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - opensearch_domain_name is defined
      - opensearch_domain_name | length > 0
    fail_msg: >-
      'opensearch_domain_name' must be defined and non-empty.
      It is used for API connectivity checks. Set it to your cluster domain or IP.

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "vars/{{ ansible_distribution }}.yml"
    - "vars/{{ ansible_os_family }}.yml"

- name: Configure system prerequisites
  ansible.builtin.include_tasks: prereqs.yml

- name: Setup repositories for {{ ansible_os_family }}
  ansible.builtin.include_tasks: "setup-{{ ansible_os_family }}.yml"

- name: Install OpenSearch node
  ansible.builtin.include_tasks: install-node.yml
  when: opensearch_install_node | bool

- name: Configure OpenSearch node
  ansible.builtin.include_tasks: config-node.yml
  when: opensearch_install_node | bool

- name: Configure security (TLS/Auth)
  ansible.builtin.include_tasks: security-config.yml
  when:
    - opensearch_install_node | bool
    - opensearch_use_tls | bool

- name: Configure security (HTTP Auth)
  ansible.builtin.include_tasks: security-config-http.yml
  when:
    - opensearch_install_node | bool
    - not opensearch_use_tls | bool

- name: Flush handlers to ensure OpenSearch is started
  ansible.builtin.meta: flush_handlers

- name: Configure access control
  ansible.builtin.include_tasks: access-control.yml
  when:
    - opensearch_install_node | bool
    - opensearch_access_control_enabled | bool

- name: Configure metrics and monitoring
  ansible.builtin.include_tasks: metrics.yml
  when:
    - opensearch_install_node | bool
    - opensearch_metrics_enabled | bool

- name: Install OpenSearch Dashboards
  ansible.builtin.include_tasks: install-dashboard.yml
  when: opensearch_install_dashboard | bool

- name: Configure OpenSearch Dashboards
  ansible.builtin.include_tasks: config-dashboard.yml
  when: opensearch_install_dashboard | bool

- name: Verify cluster health
  ansible.builtin.include_tasks: verify-cluster.yml
  when: opensearch_install_node | bool
