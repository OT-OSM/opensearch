---
# ===========================
# Access Control Configuration
# ===========================
# Only runs when opensearch_access_control_enabled is true and OpenSearch is reachable

- name: Determine protocol for API calls
  ansible.builtin.set_fact:
    _opensearch_protocol: "{{ 'https' if opensearch_use_tls else 'http' }}"

- name: Wait for OpenSearch to be ready for access control
  ansible.builtin.uri:
    url: "{{ _opensearch_protocol }}://127.0.0.1:{{ opensearch_http_port }}/"
    method: GET
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _os_ready
  until: _os_ready.status == 200
  retries: 30
  delay: 5

# ===========================
# Custom Roles
# ===========================
- name: Create custom OpenSearch roles
  ansible.builtin.uri:
    url: "{{ _opensearch_protocol }}://127.0.0.1:{{ opensearch_http_port }}/_plugins/_security/api/roles/{{ item.name }}"
    method: PUT
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      cluster_permissions: "{{ item.cluster_permissions | default([]) }}"
      index_permissions: "{{ item.index_permissions | default([]) }}"
      tenant_permissions: "{{ item.tenant_permissions | default([]) }}"
    status_code: [200, 201]
  loop: "{{ opensearch_custom_roles }}"
  when: opensearch_custom_roles | length > 0

# ===========================
# Custom Role Mappings
# ===========================
- name: Create custom role mappings
  ansible.builtin.uri:
    url: "{{ _opensearch_protocol }}://127.0.0.1:{{ opensearch_http_port }}/_plugins/_security/api/rolesmapping/{{ item.role }}"
    method: PUT
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      backend_roles: "{{ item.backend_roles | default([]) }}"
      users: "{{ item.users | default([]) }}"
      hosts: "{{ item.hosts | default([]) }}"
    status_code: [200, 201]
  loop: "{{ opensearch_custom_role_mappings }}"
  when: opensearch_custom_role_mappings | length > 0

# ===========================
# Custom Internal Users
# ===========================
- name: Create custom internal users
  ansible.builtin.uri:
    url: "{{ _opensearch_protocol }}://127.0.0.1:{{ opensearch_http_port }}/_plugins/_security/api/internalusers/{{ item.name }}"
    method: PUT
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      hash: "{{ item.password_hash }}"
      backend_roles: "{{ item.backend_roles | default([]) }}"
      opendistro_security_roles: "{{ item.security_roles | default([]) }}"
      attributes: "{{ item.attributes | default({}) }}"
    status_code: [200, 201]
  loop: "{{ opensearch_custom_internal_users }}"
  when: opensearch_custom_internal_users | length > 0
  no_log: true
