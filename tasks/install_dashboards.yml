---
# tasks/install_dashboards.yml - Install OpenSearch Dashboards

- name: Check if OpenSearch Dashboards is already installed
  command: dpkg-query -W opensearch-dashboards
  register: dashboards_installed_check
  failed_when: false
  changed_when: false
  when: ansible_os_family == "Debian"
  tags:
    - install_check

- name: Check if OpenSearch Dashboards is already installed (RedHat)
  command: rpm -q opensearch-dashboards
  register: dashboards_installed_check_rpm
  failed_when: false
  changed_when: false
  when: ansible_os_family == "RedHat"
  tags:
    - install_check

- name: Install OpenSearch Dashboards (Debian/Ubuntu)
  apt:
    name: "{{ opensearch_dashboards_package_name }}={{ opensearch_dashboards_version }}"
    state: present
    allow_change_held_packages: yes
  when: ansible_os_family == "Debian"
  notify: restart opensearch-dashboards
  tags:
    - install

- name: Install OpenSearch Dashboards (RedHat/CentOS)
  yum:
    name: "{{ opensearch_dashboards_package_name }}-{{ opensearch_dashboards_version }}"
    state: present
  when: ansible_os_family == "RedHat"
  notify: restart opensearch-dashboards
  tags:
    - install

- name: Hold OpenSearch Dashboards package version (Debian/Ubuntu)
  dpkg_selections:
    name: opensearch-dashboards
    selection: hold
  when: ansible_os_family == "Debian"
  tags:
    - install

- name: Ensure OpenSearch Dashboards directories have correct permissions
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ opensearch_dashboards_user }}"
    group: "{{ opensearch_dashboards_group }}"
    mode: '0755'
    recurse: yes
  loop:
    - "{{ opensearch_dashboards_config_dir }}"
    - "{{ opensearch_dashboards_log_dir }}"
  tags:
    - permissions

- name: Check OpenSearch Dashboards version
  command: "{{ opensearch_dashboards_home_dir }}/bin/opensearch-dashboards --version"
  register: dashboards_version_output
  changed_when: false
  failed_when: false
  tags:
    - install_check

- name: Display installed OpenSearch Dashboards version
  debug:
    msg: "Installed OpenSearch Dashboards version: {{ dashboards_version_output.stdout | default('Unable to determine') }}"
  tags:
    - install_check
