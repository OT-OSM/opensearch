---
# ===========================
# Fire Drill — Restore from MinIO Snapshot
# ===========================

- name: Define connection variables
  ansible.builtin.set_fact:
    _opensearch_url: "{{ 'https' if opensearch_use_tls | bool else 'http' }}://{{ opensearch_api_host }}:{{ opensearch_http_port }}"

- name: Wait for cluster to be healthy before restore
  uri:
    url: "{{ _opensearch_url }}/_cluster/health"
    method: GET
    user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
  register: health
  until: health.json.status in ["green", "yellow"]
  retries: 15
  delay: 10

- name: Verify restore permissions before proceeding
  uri:
    url: "{{ _opensearch_url }}/_plugins/_security/authinfo"
    method: GET
    user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    force_basic_auth: true
    validate_certs: false
  register: restore_auth_info
  failed_when: restore_auth_info.status != 200

- name: Show current user roles (diagnostic)
  ansible.builtin.debug:
    msg: >
      Restore user: {{ restore_auth_info.json.user_name | default('unknown') }}
      | Roles: {{ restore_auth_info.json.roles | default([]) }}

# ===========================
# Ensure Restore Permissions via Security API
# ===========================

- name: Create / update firedrill_restore_role with explicit snapshot permissions
  uri:
    url: "{{ _opensearch_url }}/_plugins/_security/api/roles/firedrill_restore_role"
    method: PUT
    user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      cluster_permissions:
        - "cluster:admin/*"
        - "cluster:admin/snapshot/restore"
        - "cluster:admin/snapshot/get"
        - "cluster:admin/snapshot/create"
        - "cluster:admin/snapshot/delete"
        - "cluster:admin/snapshot/status"
        - "cluster:admin/repository/get"
        - "cluster:admin/repository/put"
        - "cluster:admin/repository/delete"
        - "cluster:admin/repository/verify"
        - "cluster:monitor/*"
      index_permissions:
      - index_patterns:
            - "*"
        allowed_actions:
            - "*"
          allowed_actions:
            - "indices:admin/close"
            - "indices:admin/open"
            - "indices:admin/delete"
            - "indices:admin/create"
            - "indices:admin/mapping/put"
            - "indices:admin/settings/update"
            - "indices:data/write/*"
            - "indices:data/read/*"
            - "indices:monitor/*"
    status_code: [200, 201]
  retries: 3
  delay: 5

- name: Map admin user to firedrill_restore_role
  uri:
    url: "{{ _opensearch_url }}/_plugins/_security/api/rolesmapping/firedrill_restore_role"
    method: PUT
    user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      users:
        - "{{ opensearch_admin_username }}"
      backend_roles:
        - "admin"
    status_code: [200, 201]
  retries: 3
  delay: 5

- name: Ensure admin is mapped to the internal snapshot management role
  uri:
    url: "{{ _opensearch_url }}/_plugins/_security/api/rolesmapping/snapshot_management_full_access"
    method: PUT
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      users:
        - "{{ opensearch_admin_username }}"
      backend_roles:
        - "admin"
    status_code: [200, 201]


# ===========================
# CRITICAL: Flush Security Plugin Cache
# The in-memory permission cache must be flushed after any role/mapping change.
# ===========================

- name: Flush OpenSearch security plugin cache
  uri:
    url: "{{ _opensearch_url }}/_plugins/_security/api/cache"
    method: DELETE
    user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 201]
  register: cache_flush
  failed_when: false

- name: Show cache flush result
  ansible.builtin.debug:
    msg: "Security cache flush: {{ cache_flush.json | default(cache_flush.msg) }}"

- name: Wait for security cache to propagate across cluster nodes
  ansible.builtin.pause:
    seconds: 30

- name: Verify network connectivity to MinIO
  ansible.builtin.wait_for:
    host: "{{ minio_endpoint | regex_replace('http://|https://|:.*', '') }}"
    port: 9000  # Double check if your MinIO is on 9000 or 9001
    timeout: 5
    msg: "Cannot reach MinIO at {{ minio_endpoint }}. Check firewall or MinIO service status."

# ===========================
# Register Snapshot Repository
# ===========================

- name: Register MinIO snapshot repository
  uri:
    url: "{{ _opensearch_url }}/_snapshot/{{ opensearch_backup_repo }}"
    method: PUT
    user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      type: s3
      settings:
        bucket: "{{ opensearch_backup_bucket }}"
        endpoint: "{{ minio_endpoint }}"
        protocol: "{{ minio_protocol }}"
        region: "us-east-1"
        path_style_access: true
    status_code: [200, 201]

# ===========================
# Discover Latest Snapshot
# ===========================

- name: List all snapshots in repository
  uri:
    url: "{{ _opensearch_url }}/_snapshot/{{ opensearch_backup_repo }}/_all"
    method: GET
    user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    force_basic_auth: true
    validate_certs: false
  register: snapshot_list

- name: Fail if no snapshots found
  ansible.builtin.fail:
    msg: "No snapshots found in repository '{{ opensearch_backup_repo }}'. Cannot restore."
  when: snapshot_list.json.snapshots | length == 0

- name: Identify latest successful snapshot
  ansible.builtin.set_fact:
    opensearch_restore_snapshot_name: >-
      {{
        (snapshot_list.json.snapshots
          | selectattr('state', 'equalto', 'SUCCESS')
          | list
          | last).snapshot
      }}
  when: opensearch_restore_snapshot_name == ""

- name: Show snapshot that will be restored
  ansible.builtin.debug:
    msg: "Restoring from snapshot: {{ opensearch_restore_snapshot_name }}"

# ===========================
# Close indices before restore (best effort)
# ===========================

- name: Close all open user indices before restore
  uri:
    #url: "{{ _opensearch_url }}/*/_close"
    url: "{{ _opensearch_url }}/*,-.*/_close"
    method: POST
    user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      expand_wildcards: open
      ignore_unavailable: true
    status_code: [200, 201]
  register: close_result
  ignore_errors: true

- name: Pause to ensure cluster settles before restore
  ansible.builtin.pause:
    seconds: 10

# ===========================
# Restore Snapshot
# ===========================

#- name: Restore snapshot
 # uri:
  #  url: "{{ _opensearch_url }}/_snapshot/{{ opensearch_backup_repo }}/{{ opensearch_restore_snapshot_name }}/_restore?wait_for_completion=false"
   # method: POST
    #user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    #password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    #force_basic_auth: true
    #validate_certs: false
    #body_format: json
    #body:
     # indices: "{{ opensearch_restore_indices | default('*') }}"
      #ignore_unavailable: true
      #include_global_state: false
      #include_aliases: true
    #status_code: [200, 201, 202]
  #register: restore_result

- name: Restore snapshot
  uri:
    url: "{{ _opensearch_url }}/_snapshot/{{ opensearch_backup_repo }}/{{ opensearch_restore_snapshot_name }}/_restore?wait_for_completion=true"
    method: POST
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    # This header is the fix for the 403 error we found in your manual curl
    headers:
      securitytenant: "global"
    body_format: json
    body:
      indices: "*,-.*" 
      include_global_state: false
      include_aliases: true
      ignore_unavailable: true
    status_code: [200, 201, 202]
  register: restore_result
  retries: 5
  delay: 10
  until: restore_result.status in [200, 201, 202]

- name: Show restore accepted
  ansible.builtin.debug:
    msg: "Restore accepted: {{ restore_result.json | to_nice_json }}"



# ===========================
# Wait for restore to complete
# ===========================

- name: Wait for restore to complete (poll recovery status)
  uri:
    url: "{{ _opensearch_url }}/_cat/recovery?active_only=true&format=json"
    method: GET
    user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    force_basic_auth: true
    validate_certs: false
  register: recovery_status
  until: recovery_status.json | length == 0
  retries: 30
  delay: 15

- name: Verify cluster health after restore
  uri:
    url: "{{ _opensearch_url }}/_cluster/health?wait_for_status=yellow&timeout=60s"
    method: GET
    user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    force_basic_auth: true
    validate_certs: false
  register: post_restore_health

- name: Show cluster health after restore
  ansible.builtin.debug:
    msg: "Cluster status after restore: {{ post_restore_health.json.status }}"
