---
# ===========================
# Determine protocol
# ===========================

- name: Determine protocol
  set_fact:
    _opensearch_protocol: "{{ 'https' if opensearch_use_tls else 'http' }}"


# ===========================
# Wait for OpenSearch
# ===========================

- name: Wait for OpenSearch to accept authenticated requests
  ansible.builtin.uri:
    url: "{{ _opensearch_protocol }}://localhost:{{ opensearch_http_port }}/_cluster/health"
    method: GET
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: health_with_auth
  retries: 30
  delay: 10
  until: health_with_auth.status == 200


# ===========================
# Debug output
# ===========================

- name: Display authenticated cluster health
  debug:
    msg: >
      OpenSearch Security Active
      Protocol: {{ _opensearch_protocol }}
      Status: {{ health_with_auth.json.status }}
