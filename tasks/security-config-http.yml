#   changed_when: true

- name: Wait for OpenSearch to accept authenticated requests
  ansible.builtin.uri:
    url: "http://localhost:9200/_cluster/health"
    method: GET
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: health_with_auth
  retries: 30
  delay: 10
  until: health_with_auth.status == 200

- name: Display authenticated cluster health
  ansible.builtin.debug:
    msg: "Security active — authenticated as {{ opensearch_admin_username }} | Cluster status: {{ health_with_auth.json.status }}"
