---
# ===========================
# Metrics Configuration
# ===========================

- name: Determine protocol for API calls
  set_fact:
    opensearch_api_protocol: "{{ 'https' if opensearch_use_tls else 'http' }}"

- name: Ensure API host is defined
  assert:
    that:
      - opensearch_api_host is defined
      - opensearch_api_host | length > 0
    fail_msg: "opensearch_api_host is not defined"
    
# ===========================
# Wait for OpenSearch API
# ===========================

- name: Wait for OpenSearch cluster health API
  uri:
    url: "{{ opensearch_api_protocol }}://{{ opensearch_api_host }}:{{ opensearch_http_port }}/_cluster/health"
    method: GET
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: opensearch_health
  retries: 30
  delay: 10
  until: opensearch_health.status == 200
  when: opensearch_metrics_enabled

# ===========================
# Wait for Performance Analyzer (non-fatal)
# ===========================

- name: Wait for Performance Analyzer port
  wait_for:
    host: "{{ opensearch_api_host }}"
    port: "{{ opensearch_prometheus_port }}"
    delay: 5
    timeout: 60
  when: opensearch_performance_analyzer_enabled | bool
  ignore_errors: true
  register: pa_port_check

# ===========================
# Verify Prometheus Metrics (non-fatal)
# ===========================

- name: Verify Prometheus metrics endpoint
  uri:
    url: "{{ opensearch_api_protocol }}://{{ opensearch_api_host }}:{{ opensearch_prometheus_port }}/metrics"
    method: GET
    validate_certs: false
    status_code: 200
  register: prometheus_metrics
  retries: 5
  delay: 5
  until: prometheus_metrics.status == 200
  when:
    - opensearch_performance_analyzer_enabled | bool
    - pa_port_check is succeeded
  ignore_errors: true
