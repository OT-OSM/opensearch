---
# ===========================
# Metrics & Monitoring
# ===========================

# ---------------------------
# Determine protocol
# ---------------------------
- name: Determine protocol for API calls
  ansible.builtin.set_fact:
    _opensearch_protocol: "{{ 'https' if opensearch_use_tls | default(false) else 'http' }}"

# ---------------------------
# Default API host if not set
# ---------------------------
- name: Ensure API host is defined
  ansible.builtin.set_fact:
    _opensearch_api_host: "{{ opensearch_api_host | default('localhost') }}"

# ===========================
# Wait for OpenSearch Ready
# ===========================
- name: Wait for OpenSearch to be ready for metrics config
  ansible.builtin.uri:
    url: "{{ _opensearch_protocol }}://{{ _opensearch_api_host }}:{{ opensearch_http_port }}/"
    method: GET
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _os_metrics_ready
  until: _os_metrics_ready.status == 200
  retries: 30
  delay: 5

# ===========================
# Performance Analyzer
# ===========================
- name: Enable Performance Analyzer plugin
  ansible.builtin.uri:
    url: "{{ _opensearch_protocol }}://{{ _opensearch_api_host }}:{{ opensearch_http_port }}/_plugins/_performanceanalyzer/cluster/config"
    method: POST
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      enabled: true
      shardsPerCollection: 0
    status_code: [200, 201]
  when: opensearch_performance_analyzer_enabled | default(false) | bool
  failed_when: false

# ===========================
# Verify Cluster Metrics
# ===========================
- name: Verify metrics endpoint is accessible
  ansible.builtin.uri:
    url: "{{ _opensearch_protocol }}://{{ _opensearch_api_host }}:{{ opensearch_http_port }}/_cluster/stats"
    method: GET
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _metrics_check
  failed_when: false

- name: Display metrics endpoint status
  ansible.builtin.debug:
    msg: "Metrics endpoint available: {{ _metrics_check.status | default('unreachable') }}"
