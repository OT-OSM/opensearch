---
# User & Group
- name: Ensure opensearch-dashboards group exists
  ansible.builtin.group:
    name: opensearch-dashboards
    state: present
    system: true

- name: Ensure opensearch-dashboards user exists
  ansible.builtin.user:
    name: opensearch-dashboards
    state: present
    system: true
    group: opensearch-dashboards
    create_home: false

# Configuration
- name: Create Dashboards configuration directory
  ansible.builtin.file:
    path: "{{ opensearch_dashboards_config_dir }}"
    state: directory
    owner: opensearch-dashboards
    group: opensearch-dashboards
    mode: "0750"

- name: Create Dashboards certificates directory
  ansible.builtin.file:
    path: "{{ opensearch_dashboards_config_dir }}/certs"
    state: directory
    owner: opensearch-dashboards
    group: opensearch-dashboards
    mode: "0700"
  when: opensearch_use_tls | bool

- name: Copy certificates to Dashboards
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ opensearch_dashboards_config_dir }}/certs/{{ item.dest }}"
    owner: opensearch-dashboards
    group: opensearch-dashboards
    mode: "0600"
    remote_src: true
  loop:
    - { src: "{{ opensearch_node_cert_path }}", dest: "node.pem" }
    - { src: "{{ opensearch_node_key_path }}", dest: "node-key.pem" }
    - { src: "{{ opensearch_root_ca_path }}", dest: "root-ca.pem" }
  when: opensearch_use_tls | bool
  notify: Restart OpenSearch Dashboards
  failed_when: false

# Dashboard Config Template
- name: Deploy opensearch_dashboards.yml
  ansible.builtin.template:
    src: opensearch_dashboards.yml.j2
    dest: "{{ opensearch_dashboards_config_dir }}/opensearch_dashboards.yml"
    owner: opensearch-dashboards
    group: opensearch-dashboards
    mode: "0640"
  notify: Restart OpenSearch Dashboards

# Service Management
- name: Enable and start OpenSearch Dashboards service
  ansible.builtin.systemd:
    name: opensearch-dashboards
    state: started
    enabled: true
    daemon_reload: true

# Dashboards Verification

- name: Set Dashboards protocol
  ansible.builtin.set_fact:
    dashboards_protocol: "{{ 'https' if opensearch_use_tls | bool else 'http' }}"

- name: Verify OpenSearch Dashboards login page reachable
  ansible.builtin.uri:
    url: "{{ dashboards_protocol }}://{{ opensearch_api_host }}:{{ opensearch_dashboards_port }}"
    method: GET
    user: "{{ opensearch_kibanaserver_username }}"
    password: "{{ opensearch_kibanaserver_password }}"
    force_basic_auth: true
    status_code:
      - 200
      - 302
      - 503
    timeout: 10
    validate_certs: false
  register: dashboards_check
  retries: 40
  delay: 15
  until: dashboards_check.status in [200, 302]
  
- name: Display Dashboards verification result
  ansible.builtin.debug:
    msg: >
      Dashboards reachable at
      {{ dashboards_protocol }}://{{ opensearch_api_host }}:{{ opensearch_dashboards_port }}
      (HTTP {{ dashboards_check.status }})
