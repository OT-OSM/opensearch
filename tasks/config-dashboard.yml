---
- name: Ensure opensearch-dashboards group exists
  ansible.builtin.group:
    name: opensearch-dashboards
    state: present
    system: yes

- name: Ensure opensearch-dashboards user exists
  ansible.builtin.user:
    name: opensearch-dashboards
    state: present
    system: yes
    group: opensearch-dashboards
    create_home: no

- name: Create OpenSearch Dashboards Config Directory
  ansible.builtin.file:
    path: "{{ opensearch_dashboards_config_dir }}"
    state: directory
    owner: opensearch-dashboards
    group: opensearch-dashboards
    mode: '0750'

- name: Create Dashboards Certificates Directory
  ansible.builtin.file:
    path: "{{ opensearch_dashboards_config_dir }}/certs"
    state: directory
    owner: opensearch-dashboards
    group: opensearch-dashboards
    mode: '0700'
  when: opensearch_use_tls

- name: Copy Certificates to Dashboards (reusing node certs for simplicity in this role)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ opensearch_dashboards_config_dir }}/certs/{{ item.dest }}"
    owner: opensearch-dashboards
    group: opensearch-dashboards
    mode: '0600'
    remote_src: no # Source is on controller (if provided)
  loop:
    - { src: "{{ opensearch_node_cert_path }}", dest: "node.pem" }
    - { src: "{{ opensearch_node_key_path }}", dest: "node-key.pem" }
    - { src: "{{ opensearch_root_ca_path }}", dest: "root-ca.pem" }
  when: opensearch_use_tls
  notify: Restart OpenSearch Dashboards
  ignore_errors: yes # Ignore if paths are undefined/missing (handled in main.yml conditions ideally)

- name: Deploy opensearch_dashboards.yml
  ansible.builtin.template:
    src: opensearch_dashboards.yml.j2
    dest: "{{ opensearch_dashboards_config_dir }}/opensearch_dashboards.yml"
    owner: opensearch-dashboards
    group: opensearch-dashboards
    mode: '0640'
  notify: Restart OpenSearch Dashboards

- name: Enable and start OpenSearch Dashboards service
  ansible.builtin.service:
    name: opensearch-dashboards
    state: started
    enabled: yes
