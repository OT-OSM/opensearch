---
- name: Fix broken apt dependencies
  ansible.builtin.command: apt-get install -f -y
  become: true
  register: fix_broken
  retries: 5
  delay: 10
  until: fix_broken is succeeded
  changed_when: "'0 upgraded, 0 newly installed, 0 to remove' not in fix_broken.stdout"

- name: Install required dependencies (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ opensearch_prerequisites }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: deps_install
  until: deps_install is succeeded
  retries: 5
  delay: 5
