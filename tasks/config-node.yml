---
# User & Group

- name: Ensure opensearch group exists
  ansible.builtin.group:
    name: opensearch
    state: present
    system: true

- name: Ensure opensearch user exists
  ansible.builtin.user:
    name: opensearch
    state: present
    system: true
    group: opensearch
    create_home: false


# Password Hashes

- name: Set admin password hash fact
  ansible.builtin.set_fact:
    opensearch_admin_password_hash: "{{ opensearch_admin_password | password_hash('bcrypt') | regex_replace('^\\$2b\\$', '$2a$') }}"
  no_log: true

- name: Set kibanaserver password hash fact
  ansible.builtin.set_fact:
    opensearch_kibanaserver_password_hash: "{{ opensearch_kibanaserver_password | password_hash('bcrypt') | regex_replace('^\\$2b\\$', '$2a$') }}"
  no_log: true


# Directories

- name: Create OpenSearch required directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0750"
  loop:
    - "{{ opensearch_config_dir }}"
    - "{{ opensearch_data_path }}"
    - "{{ opensearch_logs_path }}"


# Configuration Files

- name: Deploy opensearch.yml
  ansible.builtin.template:
    src: opensearch.yml.j2
    dest: "{{ opensearch_config_dir }}/opensearch.yml"
    owner: opensearch
    group: opensearch
    mode: "0640"
  notify: Restart OpenSearch


- name: Deploy jvm.options
  ansible.builtin.template:
    src: jvm.options.j2
    dest: "{{ opensearch_config_dir }}/jvm.options"
    owner: opensearch
    group: opensearch
    mode: "0640"
  notify: Restart OpenSearch


# System Limits

- name: Configure system limits
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "{{ item }}"
    create: true
  loop:
    - "opensearch soft nofile 65536"
    - "opensearch hard nofile 65536"
    - "opensearch soft nproc 4096"
    - "opensearch hard nproc 4096"
    - "opensearch soft memlock unlimited"
    - "opensearch hard memlock unlimited"


# Systemd Override

- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/opensearch.service.d
    state: directory

- name: Deploy systemd override file
  ansible.builtin.template:
    src: opensearch_override.conf.j2
    dest: /etc/systemd/system/opensearch.service.d/override.conf
  notify:
    - Reload systemd
    - Restart OpenSearch


# Environment File

- name: Deploy environment file (Debian)
  ansible.builtin.template:
    src: opensearch.env.j2
    dest: /etc/default/opensearch
    owner: root
    group: opensearch
    mode: "0640"
  when: ansible_os_family == "Debian"
  notify: Restart OpenSearch
  no_log: true


# Fix Permissions

- name: Fix directory permissions
  ansible.builtin.file:
    path: "{{ item }}"
    owner: opensearch
    group: opensearch
    recurse: true
  loop:
    - "{{ opensearch_data_path }}"
    - "{{ opensearch_logs_path }}"
    - "{{ opensearch_config_dir }}"

# Install Performance Analyzer Plugin
 
- name: Check if performance analyzer plugin exists
  ansible.builtin.stat:
    path: /usr/share/opensearch/plugins/opensearch-performance-analyzer
  register: pa_plugin

# Install Performance Analyzer Plugin

- name: Install performance analyzer plugin
  ansible.builtin.command: >
    /usr/share/opensearch/bin/opensearch-plugin install opensearch-performance-analyzer
  args:
    creates: /usr/share/opensearch/plugins/opensearch-performance-analyzer
  notify: Restart OpenSearch
  
# Install Demo Security Configuration (HTTP mode)

- name: Install demo configuration
  ansible.builtin.command: >
    /usr/share/opensearch/plugins/opensearch-security/tools/install_demo_configuration.sh -y -i -s
  args:
    chdir: /usr/share/opensearch
  environment:
    OPENSEARCH_INITIAL_ADMIN_PASSWORD: "{{ opensearch_admin_password }}"
  when: not opensearch_use_tls | bool


# Deploy Security Files

- name: Deploy internal_users.yml
  ansible.builtin.template:
    src: internal_users.yml.j2
    dest: "{{ opensearch_config_dir }}/opensearch-security/internal_users.yml"
    owner: opensearch
    group: opensearch
    mode: "0600"
  when: not opensearch_use_tls | bool


- name: Deploy roles_mapping.yml
  ansible.builtin.template:
    src: roles_mapping.yml.j2
    dest: "{{ opensearch_config_dir }}/opensearch-security/roles_mapping.yml"
    owner: opensearch
    group: opensearch
    mode: "0600"
  when: not opensearch_use_tls | bool


# Enable Service

- name: Enable OpenSearch service
  ansible.builtin.systemd:
    name: opensearch
    enabled: true
    daemon_reload: true


# Start Service 

- name: Start OpenSearch service
  ansible.builtin.systemd:
    name: opensearch
    state: started
    enabled: true
    daemon_reload: true
  register: opensearch_service
  retries: 5
  delay: 10
  until: opensearch_service is succeeded
