---
# ===========================
# User & Group
# ===========================
- name: Ensure opensearch group exists
  ansible.builtin.group:
    name: opensearch
    state: present
    system: true

- name: Ensure opensearch user exists
  ansible.builtin.user:
    name: opensearch
    state: present
    system: true
    group: opensearch
    create_home: false

# ===========================
# Configuration Directory
# ===========================
- name: Create OpenSearch configuration directory
  ansible.builtin.file:
    path: "{{ opensearch_config_dir }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0750"

# ===========================
# Configuration Templates
# ===========================
- name: Deploy opensearch.yml configuration
  ansible.builtin.template:
    src: opensearch.yml.j2
    dest: "{{ opensearch_config_dir }}/opensearch.yml"
    owner: opensearch
    group: opensearch
    mode: "0640"
  notify: Restart OpenSearch

- name: Deploy jvm.options
  ansible.builtin.template:
    src: jvm.options.j2
    dest: "{{ opensearch_config_dir }}/jvm.options"
    owner: opensearch
    group: opensearch
    mode: "0640"
  notify: Restart OpenSearch

# ===========================
# System Limits
# ===========================
- name: Configure system limits for opensearch user
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "{{ item }}"
    create: true
    mode: "0644"
  loop:
    - "opensearch soft nofile {{ opensearch_systemd_limit_nofile }}"
    - "opensearch hard nofile {{ opensearch_systemd_limit_nofile }}"
    - "opensearch soft nproc {{ opensearch_systemd_limit_nproc }}"
    - "opensearch hard nproc {{ opensearch_systemd_limit_nproc }}"
    - "opensearch soft memlock unlimited"
    - "opensearch hard memlock unlimited"

# ===========================
# Systemd Configuration
# ===========================
# We use a systemd override (drop-in) file so that our configuration persists
# across package upgrades and doesn't conflict with the vendor-supplied unit file.
- name: Create systemd override directory for OpenSearch
  ansible.builtin.file:
    path: /etc/systemd/system/opensearch.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy OpenSearch systemd overrides
  ansible.builtin.template:
    src: opensearch_override.conf.j2
    dest: /etc/systemd/system/opensearch.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart OpenSearch

# ===========================
# Environment File
# ===========================
- name: Deploy OpenSearch environment file (Debian)
  ansible.builtin.template:
    src: opensearch.env.j2
    dest: /etc/default/opensearch
    owner: root
    group: root
    mode: "0644"
  when: ansible_os_family == 'Debian'
  notify: Restart OpenSearch

- name: Deploy OpenSearch environment file (RedHat)
  ansible.builtin.template:
    src: opensearch.env.j2
    dest: /etc/sysconfig/opensearch
    owner: root
    group: root
    mode: "0644"
  when: ansible_os_family == 'RedHat'
  notify: Restart OpenSearch

# ===========================
# Plugin Management (Auto-Recovery)
# ===========================
- name: Check if opensearch-security plugin exists
  ansible.builtin.stat:
    path: /usr/share/opensearch/plugins/opensearch-security
  register: security_plugin_dir

- name: Install opensearch-security plugin if missing
  ansible.builtin.command:
    cmd: /usr/share/opensearch/bin/opensearch-plugin install -b opensearch-security
  when: not security_plugin_dir.stat.exists
  notify: Restart OpenSearch

- name: Check if securityconfig directory exists
  ansible.builtin.stat:
    path: /usr/share/opensearch/plugins/opensearch-security/securityconfig
  register: securityconfig_dir

- name: Create securityconfig directory if missing
  ansible.builtin.file:
    path: /usr/share/opensearch/plugins/opensearch-security/securityconfig
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0755"
  when: not securityconfig_dir.stat.exists

- name: Copy default securityconfig files if directory was empty
  ansible.builtin.shell: |
    if [ -d /usr/share/opensearch/plugins/opensearch-security/tools/securityconfig ]; then
      cp -n /usr/share/opensearch/plugins/opensearch-security/tools/securityconfig/* \
        /usr/share/opensearch/plugins/opensearch-security/securityconfig/ 2>/dev/null || true
    fi
    chown -R opensearch:opensearch /usr/share/opensearch/plugins/opensearch-security/securityconfig
  when: not securityconfig_dir.stat.exists
  changed_when: true

- name: Ensure correct permissions for plugins directory
  ansible.builtin.file:
    path: /usr/share/opensearch/plugins
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0755"
    recurse: true

- name: Remove demo certificates from config directory
  ansible.builtin.file:
    path: "{{ opensearch_config_dir }}/{{ item }}"
    state: absent
  loop:
    - esnode.pem
    - esnode-key.pem
    - root-ca.pem
    - kirk.pem
    - kirk-key.pem
  when: opensearch_use_tls | bool

# ===========================
# Certificate Permissions (before service start)
# ===========================
- name: Ensure certificate files are readable by opensearch
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0750"
    recurse: true
  when: opensearch_use_tls | bool

# ===========================
# Service Management
# ===========================
- name: Enable OpenSearch service
  ansible.builtin.systemd:
    name: opensearch
    enabled: true
    daemon_reload: true

# When TLS is enabled, we do NOT start the service here.
# security-config.yml will handle: start → securityadmin → restart
# This avoids the chicken-and-egg problem of starting with TLS
# before the security index is initialized.

- name: Start OpenSearch service (non-TLS only)
  ansible.builtin.systemd:
    name: opensearch
    state: started
    daemon_reload: true
  async: 300
  poll: 5
  when: not (opensearch_use_tls | bool)
