---
# User & Group

- name: Ensure opensearch group exists
  ansible.builtin.group:
    name: opensearch
    state: present
    system: true

- name: Ensure opensearch user exists
  ansible.builtin.user:
    name: opensearch
    state: present
    system: true
    group: opensearch
    create_home: false


# Password Hashes

- name: Set admin password hash fact
  ansible.builtin.set_fact:
    opensearch_admin_password_hash: "{{ opensearch_admin_password | password_hash('bcrypt') | regex_replace('^\\$2b\\$', '$2a$') }}"
  no_log: true

- name: Set kibanaserver password hash fact
  ansible.builtin.set_fact:
    opensearch_kibanaserver_password_hash: "{{ opensearch_kibanaserver_password | password_hash('bcrypt') | regex_replace('^\\$2b\\$', '$2a$') }}"
  no_log: true


# Directories

- name: Create OpenSearch required directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0750"
  loop:
    - "{{ opensearch_config_dir }}"
    - "{{ opensearch_data_path }}"
    - "{{ opensearch_logs_path }}"


# Configuration Files

- name: Deploy opensearch.yml
  ansible.builtin.template:
    src: opensearch.yml.j2
    dest: "{{ opensearch_config_dir }}/opensearch.yml"
    owner: opensearch
    group: opensearch
    mode: "0640"
  notify: Restart OpenSearch

- name: Deploy jvm.options
  ansible.builtin.template:
    src: jvm.options.j2
    dest: "{{ opensearch_config_dir }}/jvm.options"
    owner: opensearch
    group: opensearch
    mode: "0640"
  notify: Restart OpenSearch


# System Limits

- name: Configure system limits
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "{{ item }}"
    create: true
  loop:
    - "opensearch soft nofile 65536"
    - "opensearch hard nofile 65536"
    - "opensearch soft nproc 4096"
    - "opensearch hard nproc 4096"
    - "opensearch soft memlock unlimited"
    - "opensearch hard memlock unlimited"


# Systemd Override

- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/opensearch.service.d
    state: directory

- name: Deploy systemd override file
  ansible.builtin.template:
    src: opensearch_override.conf.j2
    dest: /etc/systemd/system/opensearch.service.d/override.conf
  notify:
    - Reload systemd
    - Restart OpenSearch


# Environment File

- name: Deploy environment file (Debian)
  ansible.builtin.template:
    src: opensearch.env.j2
    dest: /etc/default/opensearch
    owner: root
    group: opensearch
    mode: "0640"
  when: ansible_os_family == "Debian"
  notify: Restart OpenSearch
  no_log: true


# Fix Permissions

- name: Fix directory permissions
  ansible.builtin.file:
    path: "{{ item }}"
    owner: opensearch
    group: opensearch
    recurse: true
  loop:
    - "{{ opensearch_data_path }}"
    - "{{ opensearch_logs_path }}"
    - "{{ opensearch_config_dir }}"


# ------------------------------------------------
# Performance Analyzer Metrics Configuration
# NOTE: Plugin is bundled with OpenSearch 2.x package install.
#       Skipping download — envoy-proxy handles external HTTPS;
#       direct outbound traffic to artifacts.opensearch.org is blocked.
# ------------------------------------------------

- name: Check if performance analyzer plugin exists
  ansible.builtin.stat:
    path: /usr/share/opensearch/plugins/opensearch-performance-analyzer
  register: pa_plugin

- name: Warn if performance analyzer plugin is missing
  ansible.builtin.debug:
    msg: >
      WARNING: performance-analyzer plugin not found at expected path.
      It should be bundled with the OpenSearch {{ opensearch_version }} package.
      Verify the package installed correctly before proceeding.
  when: not pa_plugin.stat.exists

# Ensure metrics directory
- name: Ensure performance analyzer metrics directory
  ansible.builtin.file:
    path: /dev/shm/performanceanalyzer
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0755"
  when: pa_plugin.stat.exists

# Configure webservice host
- name: Configure performance analyzer webservice host
  ansible.builtin.lineinfile:
    path: /usr/share/opensearch/plugins/opensearch-performance-analyzer/performance-analyzer-agent/performance-analyzer.properties
    regexp: '^webservice-bind-host'
    line: 'webservice-bind-host = 0.0.0.0'
  when: pa_plugin.stat.exists
  notify: Restart OpenSearch

# Configure metrics location
- name: Configure performance analyzer metrics location
  ansible.builtin.lineinfile:
    path: /usr/share/opensearch/plugins/opensearch-performance-analyzer/performance-analyzer-agent/performance-analyzer.properties
    regexp: '^metrics-location'
    line: 'metrics-location = /dev/shm/performanceanalyzer/'
  when: pa_plugin.stat.exists
  notify: Restart OpenSearch


# ------------------------------------------------
# Security Demo Config
# Running HTTP-only — TLS terminated upstream by envoy-proxy
# ------------------------------------------------

- name: Install demo configuration
  ansible.builtin.command: >
    /usr/share/opensearch/plugins/opensearch-security/tools/install_demo_configuration.sh -y -i -s
  args:
    chdir: /usr/share/opensearch
  environment:
    OPENSEARCH_INITIAL_ADMIN_PASSWORD: "{{ opensearch_admin_password }}"
  when: not opensearch_use_tls | bool


# Deploy Security Files

- name: Deploy internal_users.yml
  ansible.builtin.template:
    src: internal_users.yml.j2
    dest: "{{ opensearch_config_dir }}/opensearch-security/internal_users.yml"
    owner: opensearch
    group: opensearch
    mode: "0600"
  when: not opensearch_use_tls | bool

- name: Deploy roles_mapping.yml
  ansible.builtin.template:
    src: roles_mapping.yml.j2
    dest: "{{ opensearch_config_dir }}/opensearch-security/roles_mapping.yml"
    owner: opensearch
    group: opensearch
    mode: "0600"
  when: not opensearch_use_tls | bool


# Enable Service

- name: Enable OpenSearch service
  ansible.builtin.systemd:
    name: opensearch
    enabled: true
    daemon_reload: true


# Start Service

- name: Start OpenSearch service
  ansible.builtin.systemd:
    name: opensearch
    state: started
    enabled: true
    daemon_reload: true
  register: opensearch_service
  retries: 5
  delay: 10
  until: opensearch_service is succeeded
