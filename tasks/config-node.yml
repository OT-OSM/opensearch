---
- name: Ensure opensearch group exists
  ansible.builtin.group:
    name: opensearch
    state: present
    system: yes

- name: Ensure opensearch user exists
  ansible.builtin.user:
    name: opensearch
    state: present
    system: yes
    group: opensearch
    create_home: no

- name: Create OpenSearch Configuration Directory
  ansible.builtin.file:
    path: "{{ opensearch_config_dir }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: '0750'

- name: Configure Opensearch
  ansible.builtin.template:
    src: opensearch.yml.j2
    dest: "{{ opensearch_config_dir }}/opensearch.yml"
    owner: opensearch
    group: opensearch
    mode: '0640'
  notify: Restart OpenSearch

- name: Deploy jvm.options
  ansible.builtin.template:
    src: jvm.options.j2
    dest: "{{ opensearch_config_dir }}/jvm.options"
    owner: opensearch
    group: opensearch
    mode: '0640'
  notify: Restart OpenSearch

- name: Configure system limits for opensearch user
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "{{ item }}"
    create: yes
  loop:
    - "opensearch soft nofile 65536"
    - "opensearch hard nofile 65536"
    - "opensearch soft nproc 4096"
    - "opensearch hard nproc 4096"
    - "opensearch soft memlock unlimited"
    - "opensearch hard memlock unlimited"

- name: Create systemd override directory for OpenSearch
  ansible.builtin.file:
    path: /etc/systemd/system/opensearch.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Apply OpenSearch systemd overrides (timeout and limits)
  ansible.builtin.template:
    src: opensearch_override.conf.j2
    dest: /etc/systemd/system/opensearch.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart OpenSearch

- name: Set OpenSearch Environment File (Debian)
  ansible.builtin.template:
    src: opensearch.env.j2
    dest: /etc/default/opensearch
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == 'Debian'
  notify: Restart OpenSearch

- name: Set OpenSearch Environment File (RedHat)
  ansible.builtin.template:
    src: opensearch.env.j2
    dest: /etc/sysconfig/opensearch
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == 'RedHat'
  notify: Restart OpenSearch

- name: Enable OpenSearch service
  ansible.builtin.service:
    name: opensearch
    enabled: yes
    daemon_reload: yes

- name: Start OpenSearch service
  ansible.builtin.systemd:
    name: opensearch
    state: started
    daemon_reload: yes

- name: Get OpenSearch service status for diagnostics
  ansible.builtin.systemd:
    name: opensearch
  register: opensearch_service_status

- name: Display OpenSearch status if not active
  ansible.builtin.debug:
    msg: "OpenSearch service is {{ opensearch_service_status.status.ActiveState }}. Status: {{ opensearch_service_status.status.SubState }}"
  when: opensearch_service_status.status.ActiveState != "active"
