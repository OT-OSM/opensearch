---
# ===========================
# Java Installation
# ===========================
- name: Install Java (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ opensearch_java_package }}"
    state: present
    update_cache: true
  register: java_install_deb
  until: java_install_deb is succeeded
  retries: 5
  delay: 30
  when: ansible_os_family == 'Debian'

- name: Install Java (RedHat/Amazon)
  ansible.builtin.package:
    name: "{{ opensearch_java_package }}"
    state: present
  register: java_install_rh
  until: java_install_rh is succeeded
  retries: 5
  delay: 30
  when: ansible_os_family == 'RedHat'

# ===========================
# DNS / Hostname
# ===========================
- name: Configure OpenSearch DNS in /etc/hosts
  ansible.builtin.blockinfile:
    block: |
      {% set host_ip = hostvars[item]['private_ip'] | default(hostvars[item]['ansible_default_ipv4']['address'] | default(hostvars[item]['ansible_host'] | default(''))) %}
      {% if host_ip %}
      {{ host_ip }} {{ item }}.{{ opensearch_domain_name }} {{ item }}
      {% endif %}
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK {{ item }}"
  become: true
  loop: "{{ groups['opensearch'] | default([]) }}"
- name: Verify network connectivity between nodes (Port 9300)
  ansible.builtin.wait_for:
    host: "{{ hostvars[item]['private_ip'] | default(hostvars[item]['ansible_host'] | default(hostvars[item]['ansible_ssh_host'] | default(item))) }}"
    port: 9300
    timeout: 5
    state: started
  loop: "{{ groups['opensearch'] | default([]) }}"
  when:
    - opensearch_enable_cluster_mode | bool
    - groups['opensearch'] | length > 1
    - item != inventory_hostname
  ignore_errors: true
  register: connectivity_check
  tags: [diagnostic]

- name: Warn about potential network isolation
  ansible.builtin.debug:
    msg: "WARNING: Node {{ inventory_hostname }} cannot reach {{ item.item }} on port 9300. Cluster formation might fail."
  loop: "{{ connectivity_check.results | default([]) }}"
  when:
    - item.failed | default(false)
  tags: [diagnostic]

- name: Check if /etc/hostname is writable
  ansible.builtin.stat:
    path: /etc/hostname
  register: hostname_file_stat

- name: Set hostname for OpenSearch nodes
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  become: true
  when:
    - opensearch_configure_hostname | bool
    - hostname_file_stat.stat.writeable | default(false)
  failed_when: false

# ===========================
# Kernel Tuning
# ===========================
- name: Set vm.max_map_count
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ opensearch_vm_max_map_count }}"
    state: present
    reload: true
  become: true

- name: Set fs.file-max
  ansible.posix.sysctl:
    name: fs.file-max
    value: "{{ opensearch_systemd_limit_nofile }}"
    state: present
    reload: true
  become: true

- name: Disable swap (if configured)
  ansible.builtin.command: swapoff -a
  when:
    - ansible_swaptotal_mb | default(0) > 0
    - opensearch_disable_swap | bool
  changed_when: false
  become: true
