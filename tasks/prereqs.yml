---
# Java Validation

- name: Validate Java is installed
  ansible.builtin.command: java -version
  register: java_check
  changed_when: false
  failed_when: java_check.rc != 0

# Hostname Configuration
- name: Set hostname for OpenSearch node
  become: true
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when: opensearch_configure_hostname | bool
  failed_when: false

# Kernel Tuning
- name: Set vm.max_map_count
  become: true
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ opensearch_vm_max_map_count }}"
    state: present
    reload: true

- name: Set fs.file-max
  become: true
  ansible.posix.sysctl:
    name: fs.file-max
    value: "{{ opensearch_systemd_limit_nofile }}"
    state: present
    reload: true

- name: Disable swap (if configured)
  become: true
  ansible.builtin.command: swapoff -a
  when:
    - ansible_swaptotal_mb | default(0) > 0
    - opensearch_disable_swap | bool
  changed_when: false
