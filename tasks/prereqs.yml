---
- name: Ensure Java is installed
  ansible.builtin.package:
    name: "{{ opensearch_java_package }}"
    state: present
  register: java_install
  until: java_install is succeeded
  retries: 5
  delay: 30

- name: Configuring the opensearch DNS in /etc/hosts
  ansible.builtin.blockinfile:
    block: |
      {% set host_ip = hostvars[item]['ansible_host'] | default(hostvars[item]['ansible_default_ipv4']['address'] | default('')) %}
      {% if host_ip %}
      {{ host_ip }} {{ item }}.{{ opensearch_domain_name }} {{ item }}
      {% endif %}
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK {{ item }}"
  become: true
  with_items:
    - "{{ groups['opensearch'] | default([]) }}"
  when: 
    - groups['opensearch'] is defined
    - hostvars[item] is defined


- name: Setting up hostname of opensearch nodes
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  become: true
  ignore_errors: true
  when: opensearch_configure_hostname | default(true) | bool


- name: Set vm.max_map_count
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ opensearch_vm_max_map_count }}"
    state: present
    reload: true
  become: true

- name: Setting file max value on opensearch nodes
  ansible.posix.sysctl:
    name: fs.file-max
    value: "{{ opensearch_systemd_limit_nofile }}"
    state: present
    reload: true
  become: true

- name: Disable swap (optional but recommended for OpenSearch)
  ansible.builtin.command: swapoff -a
  when: 
    - ansible_swaptotal_mb | default(0) > 0
    - opensearch_disable_swap | bool
  changed_when: false
  become: true
