---
- name: Install OpenSearch Package (Debian)
  ansible.builtin.apt:
    name: "opensearch={{ opensearch_version }}"
    state: present
    allow_downgrade: yes
    allow_change_held_packages: yes
  environment:
    OPENSEARCH_INITIAL_ADMIN_PASSWORD: "{{ opensearch_admin_password }}"
  register: opensearch_install_deb
  until: opensearch_install_deb is succeeded
  retries: 5
  delay: 30
  when: ansible_os_family == 'Debian'

- name: Install OpenSearch Package (RedHat)
  ansible.builtin.package:
    name: "opensearch-{{ opensearch_version }}"
    state: present
  environment:
    OPENSEARCH_INITIAL_ADMIN_PASSWORD: "{{ opensearch_admin_password }}"
  register: opensearch_install_rhel
  until: opensearch_install_rhel is succeeded
  retries: 5
  delay: 30
  when: ansible_os_family == 'RedHat'
