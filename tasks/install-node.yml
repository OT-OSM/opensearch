---
# ===========================
# Repository Setup
# ===========================
- name: Import OpenSearch GPG key (Debian)
  ansible.builtin.apt_key:
    url: https://artifacts.opensearch.org/publickeys/opensearch.pgp
    state: present
  when: ansible_os_family == 'Debian'

- name: Add OpenSearch APT repository (Debian)
  ansible.builtin.apt_repository:
    repo: "deb https://artifacts.opensearch.org/releases/bundle/opensearch/{{ opensearch_major_version }}/apt stable main"
    state: present
    filename: "opensearch-{{ opensearch_major_version }}"
  when: ansible_os_family == 'Debian'

- name: Add OpenSearch YUM repository (RedHat)
  ansible.builtin.get_url:
    url: "https://artifacts.opensearch.org/releases/bundle/opensearch/{{ opensearch_major_version }}/opensearch-{{ opensearch_major_version }}.repo"
    dest: "/etc/yum.repos.d/opensearch-{{ opensearch_major_version }}.repo"
    mode: "0644"
  when: ansible_os_family == 'RedHat'

# ===========================
# Package Installation
# ===========================
# dpkg_options: force-confdef,force-confold ensures that existing user-modified
# configuration files are preserved during package upgrades instead of being
# overwritten by the package maintainer's version.

- name: Wait for apt lock (before OpenSearch install)
  ansible.builtin.shell: |
    while fuser /var/lib/dpkg/lock >/dev/null 2>&1 || fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
      echo "Waiting for apt lock..."
      sleep 5
    done
  changed_when: false
  timeout: 300
  when: ansible_os_family == 'Debian'

- name: Install OpenSearch package (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "opensearch={{ opensearch_version }}"
    state: present
    allow_downgrade: true
    allow_change_held_packages: true
    dpkg_options: "force-confdef,force-confold"
  environment:
    OPENSEARCH_INITIAL_ADMIN_PASSWORD: "{{ opensearch_admin_password }}"
    DEBIAN_FRONTEND: noninteractive
  register: opensearch_install_deb
  until: opensearch_install_deb is succeeded
  retries: 20
  delay: 30
  when: ansible_os_family == 'Debian'
  no_log: true

- name: Install OpenSearch package (RedHat/Amazon)
  ansible.builtin.package:
    name: "opensearch-{{ opensearch_version }}"
    state: present
  environment:
    OPENSEARCH_INITIAL_ADMIN_PASSWORD: "{{ opensearch_admin_password }}"
  register: opensearch_install_rhel
  until: opensearch_install_rhel is succeeded
  retries: 5
  delay: 10
  when: ansible_os_family == 'RedHat'
  no_log: true
