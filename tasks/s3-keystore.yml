---
# ===========================
# S3/MinIO Keystore Configuration
# Runs on ALL cluster nodes (keystore is node-local)
# ===========================

- name: Ensure opensearch.keystore exists
  ansible.builtin.command: /usr/share/opensearch/bin/opensearch-keystore create --silent
  args:
    creates: /etc/opensearch/opensearch.keystore
  become: true

- name: Configure MinIO access_key in OpenSearch keystore
  ansible.builtin.shell: /usr/share/opensearch/bin/opensearch-keystore add --stdin --force s3.client.default.access_key
  args:
    stdin: "{{ opensearch_minio_access_key }}"
  become: true
  no_log: true
  changed_when: false

- name: Configure MinIO secret_key in OpenSearch keystore
  ansible.builtin.shell: /usr/share/opensearch/bin/opensearch-keystore add --stdin --force s3.client.default.secret_key
  args:
    stdin: "{{ opensearch_minio_secret_key }}"
  become: true
  no_log: true
  changed_when: false

- name: Ensure keystore file allowed for OpenSearch
  ansible.builtin.file:
    path: /etc/opensearch/opensearch.keystore
    owner: opensearch
    group: opensearch
    mode: "0600"
  become: true
