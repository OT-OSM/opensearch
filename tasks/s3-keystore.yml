---
# ===========================
# S3/MinIO Keystore Configuration
# Runs on ALL cluster nodes (keystore is node-local)
# ===========================

- name: Ensure opensearch.keystore exists
  command: /usr/share/opensearch/bin/opensearch-keystore create --silent
  args:
    creates: /etc/opensearch/opensearch.keystore
  become: true

- name: Configure MinIO access_key in OpenSearch keystore
  shell: |
    printf '%s' '{{ minio_access_key }}' | \
      /usr/share/opensearch/bin/opensearch-keystore add --stdin --force s3.client.default.access_key
  become: true
  no_log: true
  changed_when: false

- name: Configure MinIO secret_key in OpenSearch keystore
  shell: |
    printf '%s' '{{ minio_secret_key }}' | \
      /usr/share/opensearch/bin/opensearch-keystore add --stdin --force s3.client.default.secret_key
  become: true
  no_log: true
  changed_when: false

- name: Fix keystore file ownership so OpenSearch can reload it via API
  ansible.builtin.file:
    path: /etc/opensearch/opensearch.keystore
    owner: opensearch
    group: opensearch
    mode: "0600"
  become: true
