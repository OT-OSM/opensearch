---
- name: Define connection variables
  ansible.builtin.set_fact:
    _opensearch_url: "{{ 'https' if opensearch_use_tls | bool else 'http' }}://{{ opensearch_api_host }}:{{ opensearch_http_port }}"

- name: Wait for cluster green
  uri:
    url: "{{ _opensearch_url }}/_cluster/health"
    method: GET
    user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
  register: health
  until: health.json.status in ["green", "yellow"]
  retries: 10
  delay: 10

# ===========================
# Create Snapshot Repository
# ===========================

- name: Create snapshot repository
  uri:
    url: "{{ _opensearch_url }}/_snapshot/{{ opensearch_backup_repo }}"
    method: PUT
    user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      type: s3
      settings:
        bucket: "{{ opensearch_backup_bucket }}"
        endpoint: "{{ minio_endpoint }}"
        protocol: "{{ minio_protocol }}"
        region: "us-east-1"
        path_style_access: true
    status_code: [200, 201]

- name: Wait before snapshot (cluster stable)
  ansible.builtin.pause:
    seconds: 30

# ===========================
# Create Snapshot (BACKUP)
# ===========================

- name: Create snapshot repository
  uri:
    url: "{{ _opensearch_url }}/_snapshot/{{ opensearch_backup_repo }}"
    method: PUT
    user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      type: s3
      settings:
        bucket: "{{ opensearch_backup_bucket }}"
        endpoint: "{{ minio_endpoint }}"   # e.g. minio:9000
        protocol: "{{ minio_protocol }}"   # http (since no TLS)
        access_key: "{{ minio_access_key }}"
        secret_key: "{{ minio_secret_key }}"
        region: "us-east-1"
        path_style_access: true
        disable_chunked_encoding: true
    status_code: [200, 201]

# ===========================
# Show Snapshot Summary
# ===========================

- name: Fetch snapshot status
  uri:
    url: "{{ _opensearch_url }}/_snapshot/{{ opensearch_backup_repo }}/{{ opensearch_backup_name }}"
    method: GET
    user: "{{ opensearch_backup_username | default(opensearch_admin_username) }}"
    password: "{{ opensearch_backup_password | default(opensearch_admin_password) }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
  register: snapshot_info

- name: Show snapshot summary
  ansible.builtin.debug:
    msg: |
      ==================== SNAPSHOT SUMMARY ====================
      Name       : {{ snapshot_info.json.snapshots[0].snapshot }}
      State      : {{ snapshot_info.json.snapshots[0].state }}
      Start Time : {{ snapshot_info.json.snapshots[0].start_time }}
      End Time   : {{ snapshot_info.json.snapshots[0].end_time }}
      Indices    : {{ snapshot_info.json.snapshots[0].indices | join(', ') }}
      Shards     : {{ snapshot_info.json.snapshots[0].shards.successful }} successful /
                   {{ snapshot_info.json.snapshots[0].shards.total }} total
      Repository : {{ opensearch_backup_repo }}
      Bucket     : {{ opensearch_backup_bucket }}
      ===========================================================

- name: Export index data as JSON
  uri:
    url: "{{ _opensearch_url }}/{{ item }}/_search?size=1000"
    method: GET
    user: "{{ opensearch_admin_username }}"
    password: "{{ opensearch_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
  loop:
    - index1
    - index2
  register: export_data

- name: Save JSON to file
  copy:
    content: "{{ item.json | to_nice_json }}"
    dest: "/tmp/{{ item.item }}.json"
  loop: "{{ export_data.results }}"

- name: Upload JSON files to MinIO
  amazon.aws.s3_object:
    bucket: "{{ opensearch_backup_bucket }}"
    object: "json-backup/{{ item.item }}.json"
    src: "/tmp/{{ item.item }}.json"
    mode: put
    endpoint_url: "{{ minio_endpoint }}"
    aws_access_key: "{{ minio_access_key }}"
    aws_secret_key: "{{ minio_secret_key }}"
    validate_certs: false
  loop: "{{ export_data.results }}"
