---
- name: Create Certificates Directory
  ansible.builtin.file:
    path: "{{ opensearch_certs_dir }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: '0700'
  when: opensearch_use_tls

- name: Copy Root CA Certificate
  ansible.builtin.copy:
    src: "{{ opensearch_root_ca_path }}"
    dest: "{{ opensearch_certs_dir }}/root-ca.pem"
    owner: opensearch
    group: opensearch
    mode: '0600'
  when: opensearch_use_tls and opensearch_root_ca_path is defined
  notify: Restart OpenSearch

- name: Copy Admin Certificate
  ansible.builtin.copy:
    src: "{{ opensearch_admin_cert_path }}"
    dest: "{{ opensearch_certs_dir }}/admin.pem"
    owner: opensearch
    group: opensearch
    mode: '0600'
  when: opensearch_use_tls and opensearch_admin_cert_path is defined

- name: Copy Admin Key
  ansible.builtin.copy:
    src: "{{ opensearch_admin_key_path }}"
    dest: "{{ opensearch_certs_dir }}/admin-key.pem"
    owner: opensearch
    group: opensearch
    mode: '0600'
  when: opensearch_use_tls and opensearch_admin_key_path is defined

- name: Copy Node Certificate
  ansible.builtin.copy:
    src: "{{ opensearch_node_cert_path }}"
    dest: "{{ opensearch_certs_dir }}/node.pem"
    owner: opensearch
    group: opensearch
    mode: '0600'
  when: opensearch_use_tls and opensearch_node_cert_path is defined
  notify: Restart OpenSearch

- name: Copy Node Key
  ansible.builtin.copy:
    src: "{{ opensearch_node_key_path }}"
    dest: "{{ opensearch_certs_dir }}/node-key.pem"
    owner: opensearch
    group: opensearch
    mode: '0600'
  when: opensearch_use_tls and opensearch_node_key_path is defined
  notify: Restart OpenSearch

- name: Deploy internal_users.yml
  ansible.builtin.template:
    src: internal_users.yml.j2
    dest: /usr/share/opensearch/plugins/opensearch-security/securityconfig/internal_users.yml
    owner: opensearch
    group: opensearch
    mode: '0640'
  when: opensearch_use_tls

# Security Admin should only be run if we are bootstrapping security index
# We need to wait for OS to be running first, which is handled in main.yml by flush_handlers
- name: Apply Security Configuration (securityadmin.sh)
  ansible.builtin.command: >
    /usr/share/opensearch/plugins/opensearch-security/tools/securityadmin.sh
    -cd /usr/share/opensearch/plugins/opensearch-security/securityconfig/
    -icl -nhnv
    -cacert {{ opensearch_certs_dir }}/root-ca.pem
    -cert {{ opensearch_certs_dir }}/admin.pem
    -key {{ opensearch_certs_dir }}/admin-key.pem
  environment:
    JAVA_HOME: /usr/share/opensearch/jdk
  ignore_errors: yes
  register: security_admin_result
  changed_when: "'ERR:' not in security_admin_result.stdout"
  when: opensearch_use_tls
