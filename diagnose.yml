---
# Quick diagnostic playbook to check OpenSearch service status and logs
- name: OpenSearch Service Diagnostics
  hosts: opensearch
  become: true
  gather_facts: no

  tasks:
    - name: Check systemd service status
      ansible.builtin.command: systemctl status opensearch
      register: service_status
      failed_when: false
      
    - name: Display service status
      ansible.builtin.debug:
        var: service_status.stdout_lines

    - name: Get last 100 lines of OpenSearch logs
      ansible.builtin.command: journalctl -u opensearch -n 100 --no-pager
      register: opensearch_logs
      failed_when: false

    - name: Display OpenSearch service logs
      ansible.builtin.debug:
        var: opensearch_logs.stdout_lines

    - name: Check OpenSearch application logs
      ansible.builtin.command: tail -n 50 /var/log/opensearch/opensearch-cluster.log
      register: app_logs
      failed_when: false
      
    - name: Display application logs
      ansible.builtin.debug:
        var: app_logs.stdout_lines
      when: app_logs.rc == 0

    - name: Check disk space
      ansible.builtin.command: df -h
      register: disk_space

    - name: Display disk space
      ansible.builtin.debug:
        var: disk_space.stdout_lines

    - name: Check memory
      ansible.builtin.command: free -h
      register: memory

    - name: Display memory
      ansible.builtin.debug:
        var: memory.stdout_lines
