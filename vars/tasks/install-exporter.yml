---
- name: Download opensearch-prometheus-exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus-community/elasticsearch_exporter/releases/download/v{{ opensearch_exporter_version }}/elasticsearch_exporter-{{ opensearch_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/opensearch-exporter.tar.gz"
    mode: '0644'

- name: Extract exporter binary
  ansible.builtin.unarchive:
    src: "/tmp/opensearch-exporter.tar.gz"
    dest: "/tmp/"
    remote_src: true

- name: Install exporter binary
  ansible.builtin.copy:
    src: "/tmp/elasticsearch_exporter-{{ opensearch_exporter_version }}.linux-amd64/elasticsearch_exporter"
    dest: "{{ opensearch_exporter_binary }}"
    mode: '0755'
    remote_src: true

- name: Deploy exporter systemd service
  ansible.builtin.template:
    src: opensearch-exporter.service.j2
    dest: /etc/systemd/system/opensearch-exporter.service
    mode: '0644'
  notify:
    - Reload systemd
    - Restart opensearch-exporter

- name: Deploy opensearch-exporter environment file
  ansible.builtin.template:
    src: opensearch-exporter.env.j2
    dest: /etc/default/opensearch-exporter
    owner: root
    group: opensearch
    mode: "0640"
  no_log: true

- name: Enable and start opensearch-exporter
  ansible.builtin.systemd:
    name: opensearch-exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Cleanup exporter tar
  ansible.builtin.file:
    path: "/tmp/opensearch-exporter.tar.gz"
    state: absent
