---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart OpenSearch
  ansible.builtin.systemd:
    name: opensearch
    state: restarted
    daemon_reload: true

- name: Restart OpenSearch Dashboards
  ansible.builtin.systemd:
    name: opensearch-dashboards
    state: restarted
    daemon_reload: true
    
- name: Restart opensearch-exporter
  ansible.builtin.systemd:
    name: opensearch-exporter
    state: restarted
