---
# Version
opensearch_version: "2.11.0"
opensearch_major_version: "2.x"  # Used for repository URLs

# Installation Toggles
opensearch_install_node: true
opensearch_install_dashboard: true
opensearch_bootstrap_cluster: false  # Disable for single node

# OpenSearch Cluster Configuration
opensearch_cluster_name: "opensearch-cluster"
opensearch_node_name: "{{ inventory_hostname }}"
opensearch_network_host: "0.0.0.0"
opensearch_http_port: 9200
opensearch_transport_port: 9300
opensearch_discovery_seed_hosts: []
opensearch_initial_master_nodes: []

opensearch_node_roles: ["cluster_manager", "data", "ingest"]
opensearch_bootstrap_memory_lock: false  # Disable to avoid bootstrap check failures

# JVM Heap
opensearch_jvm_heap_size: "512m"

# System Configuration
opensearch_vm_max_map_count: 262144
opensearch_disable_swap: false  # Set to true to disable swap
opensearch_configure_hostname: true  # Set to false if hostnames cannot be managed (e.g., in some CI/CD environments)


# Systemd / Resource Limits
opensearch_systemd_timeout: 300
opensearch_systemd_limit_nofile: 65536
opensearch_systemd_limit_nproc: 4096

# Java Configuration
opensearch_java_package: "{{ 'java-21-amazon-corretto' if ansible_distribution == 'Amazon' else ('java-17-openjdk' if ansible_os_family == 'RedHat' else 'openjdk-11-jdk') }}"

# Path Configuration
opensearch_data_path: /var/lib/opensearch
opensearch_logs_path: /var/log/opensearch


# Index Defaults
opensearch_number_of_shards: 1
opensearch_number_of_replicas: 1

# Security / TLS Configuration
opensearch_use_tls: false
# Paths on the remote machine where certs will be placed/found
opensearch_config_dir: "/etc/opensearch"
opensearch_certs_dir: "{{ opensearch_config_dir }}/certs"
opensearch_security_config_dir: "/usr/share/opensearch/plugins/opensearch-security/securityconfig"
# If opensearch_use_tls is true, you must provide source paths for these
# opensearch_root_ca_path: "/local/path/to/root-ca.pem"
# opensearch_admin_cert_path: "/local/path/to/admin.pem"
# opensearch_admin_key_path: "/local/path/to/admin-key.pem"
# opensearch_node_cert_path: "/local/path/to/node.pem"
# opensearch_node_key_path: "/local/path/to/node-key.pem"
# opensearch_http_cert_path: "/local/path/to/http.pem"
# opensearch_http_key_path: "/local/path/to/http-key.pem"

opensearch_admin_dn: []
opensearch_nodes_dn: []

# Authentication / SSO
# Set to true to enable SSO (basic auth is always enabled as fallback/internal)
opensearch_enable_sso: false
opensearch_auth_type: "basic" # Options: basic, openid, saml, etc.
opensearch_admin_username: "admin"
opensearch_admin_password: "StrongPassword123!" # Change this!

# OpenSearch Dashboards
opensearch_dashboards_port: 5601
opensearch_dashboards_host: "0.0.0.0"
opensearch_dashboards_version: "{{ opensearch_version }}"
opensearch_dashboards_config_dir: "/etc/opensearch-dashboards"
opensearch_dashboards_admin_username: "admin"  # Dashboard-specific admin username
opensearch_dashboards_opensearch_host: "localhost:9200"  # OpenSearch connection host
